<svg width="700" height="350" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="350" fill="#ffffff"/>

  <!-- Title -->
  <text x="350" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">Verification Chain: Nested Quality Gates</text>

  <!-- Layout: 2 columns, stages staggered -->
  <!-- Left column: stages 1,3,5,7 / Right column: stages 2,4,6,8 -->
  <!-- Actually: single centered pipeline, each box offset slightly for visual depth -->

  <!-- Stage dimensions -->
  <!-- Box width 300, centered at x=350, so x=200 to x=500 -->
  <!-- Each row: height 28, gap 8 between rows, start y=38 -->

  <!-- Stage 1: Human Prompt -->
  <rect x="200" y="38" width="300" height="30" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="298" y="57" text-anchor="end" font-size="10" font-weight="700" fill="#0369a1">Human Prompt</text>
  <text x="308" y="57" text-anchor="start" font-size="9" fill="#0284c7" font-style="italic">entry point</text>

  <!-- Arrow -->
  <line x1="350" y1="68" x2="350" y2="76" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 2: Intent Gate (first) -->
  <rect x="190" y="76" width="320" height="30" rx="8" fill="#fff3cd" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="95" text-anchor="end" font-size="10" font-weight="700" fill="#b45309">Intent Gate</text>
  <text x="340" y="95" text-anchor="start" font-size="9" fill="#d97706" font-style="italic">objectives alignment check</text>

  <!-- Arrow -->
  <line x1="350" y1="106" x2="350" y2="114" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 3: Context Injection -->
  <rect x="200" y="114" width="300" height="30" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="133" text-anchor="end" font-size="10" font-weight="700" fill="#1e40af">Context Injection</text>
  <text x="330" y="133" text-anchor="start" font-size="9" fill="#3b82f6" font-style="italic">domain knowledge enrichment</text>

  <!-- Arrow -->
  <line x1="350" y1="144" x2="350" y2="152" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 4: Spec-Builder -->
  <rect x="200" y="152" width="300" height="30" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="318" y="171" text-anchor="end" font-size="10" font-weight="700" fill="#065f46">Spec-Builder</text>
  <text x="328" y="171" text-anchor="start" font-size="9" fill="#047857" font-style="italic">19-section specification</text>

  <!-- Arrow -->
  <line x1="350" y1="182" x2="350" y2="190" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 5: Validator -->
  <rect x="200" y="190" width="300" height="30" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="318" y="209" text-anchor="end" font-size="10" font-weight="700" fill="#475569">Validator</text>
  <text x="328" y="209" text-anchor="start" font-size="9" fill="#64748b" font-style="italic">structural integrity</text>

  <!-- Arrow -->
  <line x1="350" y1="220" x2="350" y2="228" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 6: Spec-Reviewer -->
  <rect x="200" y="228" width="300" height="30" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="318" y="247" text-anchor="end" font-size="10" font-weight="700" fill="#991b1b">Spec-Reviewer</text>
  <text x="328" y="247" text-anchor="start" font-size="9" fill="#dc2626" font-style="italic">7-dimension quality review</text>

  <!-- Arrow -->
  <line x1="350" y1="258" x2="350" y2="266" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 7: Review Loop -->
  <rect x="200" y="266" width="300" height="30" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="318" y="285" text-anchor="end" font-size="10" font-weight="700" fill="#9a3412">Review Loop</text>
  <text x="328" y="285" text-anchor="start" font-size="9" fill="#ea580c" font-style="italic">iterative refinement</text>

  <!-- Arrow -->
  <line x1="350" y1="296" x2="350" y2="304" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 8: Intent Gate (second — identical to first) -->
  <rect x="190" y="304" width="320" height="30" rx="8" fill="#fff3cd" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="323" text-anchor="end" font-size="10" font-weight="700" fill="#b45309">Intent Gate</text>
  <text x="340" y="323" text-anchor="start" font-size="9" fill="#d97706" font-style="italic">final objectives check</text>

  <!-- Arrow -->
  <!-- (no arrow needed after last stage in this section — swarm execution is below) -->

  <!-- Sidebar annotations -->
  <!-- Left side: bookend bracket for Intent Gates -->
  <line x1="186" y1="91" x2="180" y2="91" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="180" y1="91" x2="180" y2="319" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="180" y1="319" x2="186" y2="319" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="178" y="208" text-anchor="middle" font-size="8" fill="#b45309" transform="rotate(-90,178,208)">bookend intent gates</text>

  <!-- Right side: execution note -->
  <text x="516" y="323" text-anchor="start" font-size="8.5" fill="#7c3aed" font-weight="600">→ /swarm</text>

  <!-- Bottom caption -->
  <text x="350" y="345" text-anchor="middle" font-size="8.5" fill="#94a3b8">computeCommander /sr — Verification Chain</text>
</svg>
