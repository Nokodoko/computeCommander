<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111127;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16162a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hookGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#FF6B6B;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="memGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#4ECDC4;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="dashGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#9B59B6;stop-opacity:0.05" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" fill="#e0e0e0" font-size="22" font-weight="700" letter-spacing="1">computeCommander Architecture</text>
  <text x="600" y="68" text-anchor="middle" fill="#888" font-size="13">The Physical Harness for AI Agent Orchestration</text>

  <!-- ========== LAYER 1: SOFT HARNESS (top) ========== -->
  <rect x="40" y="90" width="1120" height="130" rx="10" fill="url(#hookGrad)" stroke="#FF6B6B" stroke-width="1" stroke-opacity="0.4" filter="url(#shadow)"/>
  <text x="60" y="115" fill="#FF6B6B" font-size="14" font-weight="700">SOFT HARNESS</text>
  <text x="230" y="115" fill="#FF6B6B" font-size="11" opacity="0.7">Behavioral Rules + Intent Verification</text>

  <!-- Hook boxes -->
  <rect x="60" y="130" width="145" height="70" rx="6" fill="#1a1a2e" stroke="#FF6B6B" stroke-width="1" stroke-opacity="0.5"/>
  <text x="132" y="157" text-anchor="middle" fill="#FF6B6B" font-size="11" font-weight="600">SessionStart</text>
  <text x="132" y="174" text-anchor="middle" fill="#999" font-size="9">Context inject</text>
  <text x="132" y="188" text-anchor="middle" fill="#999" font-size="9">Stale agent sweep</text>

  <rect x="220" y="130" width="145" height="70" rx="6" fill="#1a1a2e" stroke="#FF6B6B" stroke-width="1" stroke-opacity="0.5"/>
  <text x="292" y="157" text-anchor="middle" fill="#FF6B6B" font-size="11" font-weight="600">SubagentStart</text>
  <text x="292" y="174" text-anchor="middle" fill="#999" font-size="9">Register agent</text>
  <text x="292" y="188" text-anchor="middle" fill="#999" font-size="9">Assign color</text>

  <rect x="380" y="130" width="145" height="70" rx="6" fill="#1a1a2e" stroke="#FF6B6B" stroke-width="1" stroke-opacity="0.5"/>
  <text x="452" y="157" text-anchor="middle" fill="#FF6B6B" font-size="11" font-weight="600">SubagentStop</text>
  <text x="452" y="174" text-anchor="middle" fill="#999" font-size="9">Mark completed</text>
  <text x="452" y="188" text-anchor="middle" fill="#999" font-size="9">Send mail</text>

  <rect x="540" y="130" width="145" height="70" rx="6" fill="#1a1a2e" stroke="#FF6B6B" stroke-width="1" stroke-opacity="0.5"/>
  <text x="612" y="157" text-anchor="middle" fill="#FF6B6B" font-size="11" font-weight="600">PostToolUse</text>
  <text x="612" y="174" text-anchor="middle" fill="#999" font-size="9">Update activity</text>
  <text x="612" y="188" text-anchor="middle" fill="#999" font-size="9">Token counting</text>

  <rect x="700" y="130" width="145" height="70" rx="6" fill="#1a1a2e" stroke="#FF6B6B" stroke-width="1" stroke-opacity="0.5"/>
  <text x="772" y="157" text-anchor="middle" fill="#FF6B6B" font-size="11" font-weight="600">Intent Verify</text>
  <text x="772" y="174" text-anchor="middle" fill="#999" font-size="9">Objective alignment</text>
  <text x="772" y="188" text-anchor="middle" fill="#999" font-size="9">Predicate gates</text>

  <rect x="860" y="130" width="145" height="70" rx="6" fill="#1a1a2e" stroke="#FF6B6B" stroke-width="1" stroke-opacity="0.5"/>
  <text x="932" y="157" text-anchor="middle" fill="#FF6B6B" font-size="11" font-weight="600">SessionEnd</text>
  <text x="932" y="174" text-anchor="middle" fill="#999" font-size="9">Session cleanup</text>
  <text x="932" y="188" text-anchor="middle" fill="#999" font-size="9">State isolation</text>

  <!-- Arrow: Soft Harness -> Hook Bridge -->
  <line x1="600" y1="220" x2="600" y2="240" stroke="#FF6B6B" stroke-width="2" marker-end="url(#arrowRed)"/>
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF6B6B"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9B59B6"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ECDC4"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFB347"/>
    </marker>
  </defs>

  <!-- ========== LAYER 2: HOOK BRIDGE (middle connector) ========== -->
  <rect x="200" y="240" width="800" height="60" rx="8" fill="#1a1a2e" stroke="#FFB347" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="600" y="267" text-anchor="middle" fill="#FFB347" font-size="14" font-weight="700">HOOK BRIDGE</text>
  <text x="600" y="285" text-anchor="middle" fill="#999" font-size="10">cmdr-bridge.sh + hook-bridge (Go binary) + /tmp/cmdr-state/ per-session isolation</text>

  <!-- Arrows from bridge down to dashboard and SQLite -->
  <line x1="400" y1="300" x2="400" y2="330" stroke="#FFB347" stroke-width="2" marker-end="url(#arrowGold)"/>
  <line x1="800" y1="300" x2="800" y2="330" stroke="#FFB347" stroke-width="2" marker-end="url(#arrowGold)"/>

  <!-- ========== LAYER 3: PHYSICAL HARNESS (dashboard + data) ========== -->
  <rect x="40" y="330" width="1120" height="340" rx="10" fill="url(#dashGrad)" stroke="#9B59B6" stroke-width="1" stroke-opacity="0.4" filter="url(#shadow)"/>
  <text x="60" y="355" fill="#9B59B6" font-size="14" font-weight="700">PHYSICAL HARNESS</text>
  <text x="280" y="355" fill="#9B59B6" font-size="11" opacity="0.7">computeCommander Dashboard + Data Layer</text>

  <!-- Dashboard panes - top row -->
  <rect x="60" y="370" width="120" height="160" rx="6" fill="#1a1a2e" stroke="#82E0AA" stroke-width="1" stroke-opacity="0.6"/>
  <text x="120" y="395" text-anchor="middle" fill="#82E0AA" font-size="11" font-weight="600">File Picker</text>
  <text x="120" y="415" text-anchor="middle" fill="#666" font-size="9">fp + wrapper</text>
  <text x="120" y="432" text-anchor="middle" fill="#666" font-size="9">CWD tracking</text>
  <text x="120" y="449" text-anchor="middle" fill="#666" font-size="9">Session-aware</text>

  <rect x="195" y="370" width="420" height="160" rx="6" fill="#1a1a2e" stroke="#5DADE2" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="405" y="395" text-anchor="middle" fill="#5DADE2" font-size="13" font-weight="700">Agent Session</text>
  <text x="405" y="418" text-anchor="middle" fill="#888" font-size="10">Claude Code CLI (borderless pane)</text>
  <text x="405" y="438" text-anchor="middle" fill="#666" font-size="9">--dangerously-skip-permissions --no-chrome</text>
  <text x="405" y="458" text-anchor="middle" fill="#666" font-size="9">Session switch via CWD file watcher</text>
  <text x="405" y="478" text-anchor="middle" fill="#5DADE2" font-size="9" opacity="0.7">67% width  |  Focused by default</text>

  <rect x="630" y="370" width="180" height="95" rx="6" fill="#1a1a2e" stroke="#9B59B6" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="720" y="395" text-anchor="middle" fill="#9B59B6" font-size="12" font-weight="700">Agents Pane</text>
  <text x="720" y="415" text-anchor="middle" fill="#888" font-size="9">Real-time status table</text>
  <text x="720" y="432" text-anchor="middle" fill="#666" font-size="9">fsnotify + 3s polling</text>
  <text x="720" y="449" text-anchor="middle" fill="#666" font-size="9">Color-coded by palette</text>

  <rect x="630" y="475" width="180" height="55" rx="6" fill="#1a1a2e" stroke="#F1948A" stroke-width="1" stroke-opacity="0.5"/>
  <text x="720" y="498" text-anchor="middle" fill="#F1948A" font-size="11" font-weight="600">Jira</text>
  <text x="720" y="516" text-anchor="middle" fill="#666" font-size="9">Issue tracking</text>

  <!-- Right column: Mail + Merge -->
  <rect x="825" y="370" width="155" height="80" rx="6" fill="#1a1a2e" stroke="#FFB347" stroke-width="1" stroke-opacity="0.5"/>
  <text x="902" y="393" text-anchor="middle" fill="#FFB347" font-size="11" font-weight="600">Mail System</text>
  <text x="902" y="412" text-anchor="middle" fill="#666" font-size="9">Inter-agent messaging</text>
  <text x="902" y="428" text-anchor="middle" fill="#666" font-size="9">Notifications, escalations</text>
  <text x="902" y="444" text-anchor="middle" fill="#666" font-size="9">Priority routing</text>

  <rect x="825" y="460" width="155" height="70" rx="6" fill="#1a1a2e" stroke="#7B68EE" stroke-width="1" stroke-opacity="0.5"/>
  <text x="902" y="483" text-anchor="middle" fill="#7B68EE" font-size="11" font-weight="600">Merge Queue</text>
  <text x="902" y="502" text-anchor="middle" fill="#666" font-size="9">Branch ordering</text>
  <text x="902" y="518" text-anchor="middle" fill="#666" font-size="9">Conflict detection</text>

  <rect x="995" y="370" width="150" height="160" rx="6" fill="#1a1a2e" stroke="#FA8072" stroke-width="1" stroke-opacity="0.5"/>
  <text x="1070" y="395" text-anchor="middle" fill="#FA8072" font-size="11" font-weight="600">LazyGit</text>
  <text x="1070" y="415" text-anchor="middle" fill="#666" font-size="9">Git operations</text>
  <text x="1070" y="445" text-anchor="middle" fill="#FA8072" font-size="11" font-weight="600">Events</text>
  <text x="1070" y="465" text-anchor="middle" fill="#666" font-size="9">Lifecycle log</text>
  <text x="1070" y="495" text-anchor="middle" fill="#FA8072" font-size="11" font-weight="600">Evals</text>
  <text x="1070" y="515" text-anchor="middle" fill="#666" font-size="9">Intent results</text>

  <!-- SQLite Database -->
  <rect x="340" y="550" width="520" height="50" rx="6" fill="#1a1a2e" stroke="#FFB347" stroke-width="1.5"/>
  <text x="600" y="575" text-anchor="middle" fill="#FFB347" font-size="12" font-weight="700">SQLite Database</text>
  <text x="600" y="592" text-anchor="middle" fill="#888" font-size="9">.computecommander/local.db  |  sessions  |  events  |  mail  |  merge_queue  |  evals</text>

  <!-- Zellij label -->
  <rect x="60" y="615" width="1090" height="35" rx="6" fill="none" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="600" y="637" text-anchor="middle" fill="#777" font-size="11">Zellij KDL Layout (generated per-session by internal/zellij/layout.go)</text>

  <!-- ========== LAYER 4: MEMORY LAYER (bottom) ========== -->
  <rect x="40" y="680" width="1120" height="130" rx="10" fill="url(#memGrad)" stroke="#4ECDC4" stroke-width="1" stroke-opacity="0.4" filter="url(#shadow)"/>
  <text x="60" y="705" fill="#4ECDC4" font-size="14" font-weight="700">MEMORY LAYER</text>
  <text x="225" y="705" fill="#4ECDC4" font-size="11" opacity="0.7">OpenBrain (ob1) + TrustGraph</text>

  <rect x="60" y="720" width="200" height="70" rx="6" fill="#1a1a2e" stroke="#4ECDC4" stroke-width="1" stroke-opacity="0.5"/>
  <text x="160" y="747" text-anchor="middle" fill="#4ECDC4" font-size="11" font-weight="600">OpenBrain MCP</text>
  <text x="160" y="767" text-anchor="middle" fill="#666" font-size="9">ob.write | ob.read | ob.query</text>
  <text x="160" y="781" text-anchor="middle" fill="#666" font-size="9">Persistent memory across sessions</text>

  <rect x="280" y="720" width="200" height="70" rx="6" fill="#1a1a2e" stroke="#4ECDC4" stroke-width="1" stroke-opacity="0.5"/>
  <text x="380" y="747" text-anchor="middle" fill="#4ECDC4" font-size="11" font-weight="600">TrustGraph</text>
  <text x="380" y="767" text-anchor="middle" fill="#666" font-size="9">Knowledge graph (RDF triples)</text>
  <text x="380" y="781" text-anchor="middle" fill="#666" font-size="9">Entity relationships</text>

  <rect x="500" y="720" width="200" height="70" rx="6" fill="#1a1a2e" stroke="#4ECDC4" stroke-width="1" stroke-opacity="0.5"/>
  <text x="600" y="747" text-anchor="middle" fill="#4ECDC4" font-size="11" font-weight="600">PostgreSQL + pgvector</text>
  <text x="600" y="767" text-anchor="middle" fill="#666" font-size="9">384-dim embeddings</text>
  <text x="600" y="781" text-anchor="middle" fill="#666" font-size="9">Semantic search</text>

  <rect x="720" y="720" width="200" height="70" rx="6" fill="#1a1a2e" stroke="#4ECDC4" stroke-width="1" stroke-opacity="0.5"/>
  <text x="820" y="747" text-anchor="middle" fill="#4ECDC4" font-size="11" font-weight="600">Context Injection</text>
  <text x="820" y="767" text-anchor="middle" fill="#666" font-size="9">Identity | Project | Session</text>
  <text x="820" y="781" text-anchor="middle" fill="#666" font-size="9">Knowledge | Hybrid layers</text>

  <rect x="940" y="720" width="200" height="70" rx="6" fill="#1a1a2e" stroke="#4ECDC4" stroke-width="1" stroke-opacity="0.5"/>
  <text x="1040" y="747" text-anchor="middle" fill="#4ECDC4" font-size="11" font-weight="600">Embedding Sidecar</text>
  <text x="1040" y="767" text-anchor="middle" fill="#666" font-size="9">MiniLM-L6-v2 (local)</text>
  <text x="1040" y="781" text-anchor="middle" fill="#666" font-size="9">No API calls</text>

  <!-- Connecting arrows between layers -->
  <!-- Bridge to SQLite -->
  <line x1="600" y1="300" x2="600" y2="550" stroke="#FFB347" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.4"/>

  <!-- Dashboard to Memory -->
  <line x1="300" y1="650" x2="300" y2="680" stroke="#4ECDC4" stroke-width="1.5" marker-end="url(#arrowTeal)" opacity="0.6"/>
  <line x1="900" y1="650" x2="900" y2="680" stroke="#4ECDC4" stroke-width="1.5" marker-end="url(#arrowTeal)" opacity="0.6"/>

  <!-- Side labels -->
  <text x="1175" y="180" text-anchor="end" fill="#FF6B6B" font-size="10" opacity="0.5" transform="rotate(-90, 1175, 180)">RULES</text>
  <text x="1175" y="480" text-anchor="end" fill="#9B59B6" font-size="10" opacity="0.5" transform="rotate(-90, 1175, 480)">OPERATIONS</text>
  <text x="1175" y="740" text-anchor="end" fill="#4ECDC4" font-size="10" opacity="0.5" transform="rotate(-90, 1175, 740)">MEMORY</text>

  <!-- Footer -->
  <text x="600" y="840" text-anchor="middle" fill="#555" font-size="10">Hook Bridge connects all three layers: Soft Harness (behavioral rules) + Physical Harness (operational control) + Memory Layer (persistent context)</text>
  <text x="600" y="860" text-anchor="middle" fill="#444" font-size="9">Built on overstory by jaymin West  |  Go + SQLite + Zellij + bubbletea  |  Claude Code hooks</text>
  <text x="600" y="880" text-anchor="middle" fill="#333" font-size="8">github.com/jaymin-west/overstory</text>
</svg>
