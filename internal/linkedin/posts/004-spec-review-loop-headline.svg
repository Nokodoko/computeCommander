<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111127;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="loopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#9B59B6;stop-opacity:0.08" />
    </linearGradient>
    <linearGradient id="specGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2ECC71;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="reviewGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E74C3C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fixGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB347;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F39C12;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="passGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2ECC71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27AE60;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ECDC4"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF6B6B"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFB347"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2ECC71"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.04"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Central loop area -->
  <ellipse cx="600" cy="320" rx="280" ry="200" fill="url(#loopGrad)" stroke="#4ECDC4" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- Title -->
  <text x="600" y="68" text-anchor="middle" fill="#e0e0e0" font-size="32" font-weight="800" letter-spacing="0.5">How I Made AI Write Its Own Requirements</text>
  <text x="600" y="105" text-anchor="middle" fill="#9B59B6" font-size="20" font-weight="600" letter-spacing="1">And Then Argue With Itself Until They're Right</text>

  <!-- SPEC node (left) -->
  <rect x="150" y="230" width="180" height="100" rx="12" fill="#1a1a2e" stroke="url(#specGrad)" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="240" y="268" text-anchor="middle" fill="#4ECDC4" font-size="18" font-weight="700" filter="url(#glow)">SPEC</text>
  <text x="240" y="290" text-anchor="middle" fill="#888" font-size="11">19-section format</text>
  <text x="240" y="307" text-anchor="middle" fill="#888" font-size="11">Data models, agents</text>
  <text x="240" y="324" text-anchor="middle" fill="#666" font-size="10">spec-builder agent</text>

  <!-- REVIEW node (top right) -->
  <rect x="660" y="175" width="180" height="100" rx="12" fill="#1a1a2e" stroke="url(#reviewGrad)" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="750" y="213" text-anchor="middle" fill="#FF6B6B" font-size="18" font-weight="700" filter="url(#glow)">REVIEW</text>
  <text x="750" y="235" text-anchor="middle" fill="#888" font-size="11">7 dimensions</text>
  <text x="750" y="252" text-anchor="middle" fill="#888" font-size="11">Structured findings</text>
  <text x="750" y="269" text-anchor="middle" fill="#666" font-size="10">spec-reviewer agent</text>

  <!-- FIX node (bottom right) -->
  <rect x="660" y="355" width="180" height="100" rx="12" fill="#1a1a2e" stroke="url(#fixGrad)" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="750" y="393" text-anchor="middle" fill="#FFB347" font-size="18" font-weight="700" filter="url(#glow)">FIX</text>
  <text x="750" y="415" text-anchor="middle" fill="#888" font-size="11">Feedback integration</text>
  <text x="750" y="432" text-anchor="middle" fill="#888" font-size="11">Critical + warning fixes</text>
  <text x="750" y="449" text-anchor="middle" fill="#666" font-size="10">spec-builder revises</text>

  <!-- PASS node (far right) -->
  <rect x="950" y="270" width="160" height="90" rx="12" fill="#1a1a2e" stroke="url(#passGrad)" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1030" y="308" text-anchor="middle" fill="#2ECC71" font-size="20" font-weight="800" filter="url(#glow)">PASS</text>
  <text x="1030" y="332" text-anchor="middle" fill="#888" font-size="11">Zero critical findings</text>
  <text x="1030" y="349" text-anchor="middle" fill="#2ECC71" font-size="10">Execute with /swarm</text>

  <!-- Arrows: SPEC -> REVIEW -->
  <line x1="330" y1="255" x2="658" y2="225" stroke="#4ECDC4" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <text x="480" y="225" text-anchor="middle" fill="#4ECDC4" font-size="11" font-weight="600">SPEC.md</text>

  <!-- Arrows: REVIEW -> FIX (FAIL path) -->
  <line x1="750" y1="275" x2="750" y2="353" stroke="#FF6B6B" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="780" y="320" fill="#FF6B6B" font-size="11" font-weight="600">FAIL?</text>

  <!-- Arrows: FIX -> SPEC (loop back) -->
  <path d="M 660 405 C 500 440, 350 400, 280 332" fill="none" stroke="#FFB347" stroke-width="2.5" marker-end="url(#arrowGold)"/>
  <text x="440" y="410" text-anchor="middle" fill="#FFB347" font-size="11" font-weight="600">feedback.md</text>

  <!-- Arrows: REVIEW -> PASS -->
  <line x1="840" y1="230" x2="948" y2="295" stroke="#2ECC71" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="905" y="248" fill="#2ECC71" font-size="11" font-weight="600">PASS?</text>

  <!-- Iteration counter -->
  <text x="600" y="355" text-anchor="middle" fill="#9B59B6" font-size="14" font-weight="700" opacity="0.8">Max 3 iterations</text>
  <text x="600" y="375" text-anchor="middle" fill="#666" font-size="11">Most specs converge in 1-2</text>

  <!-- Bottom info boxes -->
  <rect x="90" y="490" width="200" height="55" rx="8" fill="#1a1a2e" stroke="#5DADE2" stroke-width="1" stroke-opacity="0.5"/>
  <text x="190" y="515" text-anchor="middle" fill="#5DADE2" font-size="12" font-weight="600">Context Injection</text>
  <text x="190" y="533" text-anchor="middle" fill="#666" font-size="10">Domain knowledge enrichment</text>

  <rect x="320" y="490" width="200" height="55" rx="8" fill="#1a1a2e" stroke="#FFB347" stroke-width="1" stroke-opacity="0.5"/>
  <text x="420" y="515" text-anchor="middle" fill="#FFB347" font-size="12" font-weight="600">Intent Engineering</text>
  <text x="420" y="533" text-anchor="middle" fill="#666" font-size="10">Objective alignment gate</text>

  <rect x="550" y="490" width="200" height="55" rx="8" fill="#1a1a2e" stroke="#4ECDC4" stroke-width="1" stroke-opacity="0.5"/>
  <text x="650" y="515" text-anchor="middle" fill="#4ECDC4" font-size="12" font-weight="600">19-Section Template</text>
  <text x="650" y="533" text-anchor="middle" fill="#666" font-size="10">Gold-standard structure</text>

  <rect x="780" y="490" width="200" height="55" rx="8" fill="#1a1a2e" stroke="#FF6B6B" stroke-width="1" stroke-opacity="0.5"/>
  <text x="880" y="515" text-anchor="middle" fill="#FF6B6B" font-size="12" font-weight="600">7 Review Dimensions</text>
  <text x="880" y="533" text-anchor="middle" fill="#666" font-size="10">Completeness to actionability</text>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#555" font-size="11">The Spec-Review Loop: Deterministic Specifications from Probabilistic Systems</text>
  <text x="600" y="612" text-anchor="middle" fill="#444" font-size="10">Article #4 in the AI Agent Harness Series</text>
</svg>
