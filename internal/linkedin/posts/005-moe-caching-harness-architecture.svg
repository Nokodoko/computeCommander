<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="tier1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="tier2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="tier3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cache" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="520" rx="12" fill="url(#bg)"/>

  <!-- Title -->
  <text x="350" y="36" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">MoE Agent Architecture: Local Models + Frontier Routing</text>
  <text x="350" y="54" text-anchor="middle" fill="#94a3b8" font-size="11">System-level Mixture of Experts with Caching Layer</text>

  <!-- Incoming Request -->
  <rect x="275" y="68" width="150" height="34" rx="6" fill="#334155" stroke="#475569" stroke-width="1" filter="url(#shadow)"/>
  <text x="350" y="89" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Incoming Prompt</text>

  <!-- Arrow down from request to harness -->
  <line x1="350" y1="102" x2="350" y2="118" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <defs>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#22c55e"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f59e0b"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- HARNESS / GATING NETWORK -->
  <rect x="140" y="118" width="420" height="52" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#shadow)"/>
  <text x="350" y="140" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="700">HARNESS / GATING NETWORK</text>
  <text x="350" y="156" text-anchor="middle" fill="#94a3b8" font-size="9">claude-hooks: intent | context-inject | lazy-loader | supervisor</text>

  <!-- Arrows from harness to three tiers -->
  <!-- Left arrow to Tier 1 -->
  <path d="M 230 170 L 130 195" stroke="#22c55e" stroke-width="1.5" fill="none" marker-end="url(#arrowGreen)"/>
  <!-- Center arrow to Tier 2 -->
  <line x1="350" y1="170" x2="350" y2="195" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <!-- Right arrow to Tier 3 -->
  <path d="M 470 170 L 570 195" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#arrowAmber)"/>

  <!-- TIER 1: Deterministic Rules -->
  <rect x="30" y="195" width="200" height="110" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="195" width="200" height="26" rx="8" fill="url(#tier1)"/>
  <rect x="30" y="210" width="200" height="11" fill="url(#tier1)"/>
  <text x="130" y="213" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">TIER 1: Deterministic</text>
  <text x="130" y="240" text-anchor="middle" fill="#86efac" font-size="9">Cost: FREE | Latency: &lt;1ms</text>
  <text x="48" y="258" fill="#a7f3d0" font-size="9">- Rules engine routing</text>
  <text x="48" y="272" fill="#a7f3d0" font-size="9">- Keyword classification</text>
  <text x="48" y="286" fill="#a7f3d0" font-size="9">- Regex pattern matching</text>
  <text x="48" y="300" fill="#a7f3d0" font-size="9">- Switch/map lookups</text>

  <!-- TIER 2: Local Models -->
  <rect x="250" y="195" width="200" height="110" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="250" y="195" width="200" height="26" rx="8" fill="url(#tier2)"/>
  <rect x="250" y="210" width="200" height="11" fill="url(#tier2)"/>
  <text x="350" y="213" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">TIER 2: Local Models</text>
  <text x="350" y="240" text-anchor="middle" fill="#93c5fd" font-size="9">Cost: ~FREE | Latency: 3-50ms</text>
  <text x="268" y="258" fill="#bfdbfe" font-size="9">- Ollama / Gemma 2B</text>
  <text x="268" y="272" fill="#bfdbfe" font-size="9">- Embeddings (2048-dim)</text>
  <text x="268" y="286" fill="#bfdbfe" font-size="9">- Similarity search</text>
  <text x="268" y="300" fill="#bfdbfe" font-size="9">- Duplicate detection</text>

  <!-- TIER 3: Frontier Model -->
  <rect x="470" y="195" width="200" height="110" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="470" y="195" width="200" height="26" rx="8" fill="url(#tier3)"/>
  <rect x="470" y="210" width="200" height="11" fill="url(#tier3)"/>
  <text x="570" y="213" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">TIER 3: Frontier</text>
  <text x="570" y="240" text-anchor="middle" fill="#fcd34d" font-size="9">Cost: $$$ | Latency: 2-10s</text>
  <text x="488" y="258" fill="#fde68a" font-size="9">- Claude Opus reasoning</text>
  <text x="488" y="272" fill="#fde68a" font-size="9">- Root cause analysis</text>
  <text x="488" y="286" fill="#fde68a" font-size="9">- Spec generation</text>
  <text x="488" y="300" fill="#fde68a" font-size="9">- Complex code review</text>

  <!-- Percentage labels -->
  <text x="130" y="320" text-anchor="middle" fill="#22c55e" font-size="14" font-weight="800">~50%</text>
  <text x="350" y="320" text-anchor="middle" fill="#3b82f6" font-size="14" font-weight="800">~35%</text>
  <text x="570" y="320" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="800">~15%</text>
  <text x="130" y="333" text-anchor="middle" fill="#64748b" font-size="8">of invocations</text>
  <text x="350" y="333" text-anchor="middle" fill="#64748b" font-size="8">of invocations</text>
  <text x="570" y="333" text-anchor="middle" fill="#64748b" font-size="8">of invocations</text>

  <!-- CACHING LAYER -->
  <rect x="60" y="348" width="580" height="80" rx="8" fill="#2e1065" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="60" y="348" width="580" height="24" rx="8" fill="url(#cache)"/>
  <rect x="60" y="362" width="580" height="10" fill="url(#cache)"/>
  <text x="350" y="366" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">CACHING LAYER</text>

  <!-- Cache boxes -->
  <rect x="78" y="382" width="122" height="36" rx="5" fill="#3b0764" stroke="#a78bfa" stroke-width="1"/>
  <text x="139" y="397" text-anchor="middle" fill="#ddd6fe" font-size="8" font-weight="600">Intent Cache</text>
  <text x="139" y="410" text-anchor="middle" fill="#a78bfa" font-size="7">JSON / atomic write</text>

  <rect x="210" y="382" width="122" height="36" rx="5" fill="#3b0764" stroke="#a78bfa" stroke-width="1"/>
  <text x="271" y="397" text-anchor="middle" fill="#ddd6fe" font-size="8" font-weight="600">Context Map Cache</text>
  <text x="271" y="410" text-anchor="middle" fill="#a78bfa" font-size="7">Compiled regex pool</text>

  <rect x="342" y="382" width="122" height="36" rx="5" fill="#3b0764" stroke="#a78bfa" stroke-width="1"/>
  <text x="403" y="397" text-anchor="middle" fill="#ddd6fe" font-size="8" font-weight="600">Lazy Plugin Cache</text>
  <text x="403" y="410" text-anchor="middle" fill="#a78bfa" font-size="7">On-demand loading</text>

  <rect x="474" y="382" width="148" height="36" rx="5" fill="#3b0764" stroke="#a78bfa" stroke-width="1"/>
  <text x="548" y="397" text-anchor="middle" fill="#ddd6fe" font-size="8" font-weight="600">Warm-Start Cache</text>
  <text x="548" y="410" text-anchor="middle" fill="#a78bfa" font-size="7">OpenBrain session recall</text>

  <!-- Bidirectional arrows between tiers and cache -->
  <line x1="130" y1="306" x2="139" y2="348" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrowPurple)"/>
  <line x1="350" y1="306" x2="350" y2="348" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrowPurple)"/>
  <line x1="570" y1="306" x2="548" y2="348" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrowPurple)"/>

  <!-- OUTPUT ARTIFACTS -->
  <rect x="140" y="444" width="420" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" filter="url(#shadow)"/>
  <text x="350" y="464" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="700">OUTPUT ARTIFACTS</text>
  <text x="185" y="484" fill="#94a3b8" font-size="8">Audit Trail</text>
  <text x="278" y="484" fill="#94a3b8" font-size="8">Cost Attribution</text>
  <text x="385" y="484" fill="#94a3b8" font-size="8">Cache Metrics</text>
  <text x="485" y="484" fill="#94a3b8" font-size="8">Latency Breakdown</text>

  <!-- Dots between artifact labels -->
  <circle cx="255" cy="481" r="2" fill="#475569"/>
  <circle cx="363" cy="481" r="2" fill="#475569"/>
  <circle cx="468" cy="481" r="2" fill="#475569"/>

  <!-- Arrow from cache to output -->
  <line x1="350" y1="428" x2="350" y2="444" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowGray)"/>

</svg>
