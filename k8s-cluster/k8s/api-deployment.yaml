apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: compute-commander
  labels:
    app: api-server
    app.kubernetes.io/part-of: compute-commander
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
        - name: api-server
          image: api-server:latest
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: API_PORT
              value: "3000"
            - name: WS_SERVER_URL
              value: "http://websocket-server.compute-commander.svc.cluster.local:8080"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
