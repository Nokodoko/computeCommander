apiVersion: v1
kind: Service
metadata:
  name: haproxy
  namespace: compute-commander
  labels:
    app: haproxy
    app.kubernetes.io/part-of: compute-commander
spec:
  type: LoadBalancer
  selector:
    app: haproxy
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: ws
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: stats
      port: 9090
      targetPort: 9090
      protocol: TCP
