apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-server
  namespace: compute-commander
  labels:
    app: websocket-server
    app.kubernetes.io/part-of: compute-commander
spec:
  replicas: 1
  selector:
    matchLabels:
      app: websocket-server
  template:
    metadata:
      labels:
        app: websocket-server
    spec:
      containers:
        - name: websocket-server
          image: websocket-server:latest
          ports:
            - containerPort: 8080
              name: ws
              protocol: TCP
          env:
            - name: WS_PORT
              value: "8080"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
