apiVersion: apps/v1
kind: Deployment
metadata:
  name: haproxy
  namespace: compute-commander
  labels:
    app: haproxy
    app.kubernetes.io/part-of: compute-commander
spec:
  replicas: 1
  selector:
    matchLabels:
      app: haproxy
  template:
    metadata:
      labels:
        app: haproxy
    spec:
      containers:
        - name: haproxy
          image: haproxy:2.9-alpine
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
            - containerPort: 8080
              name: ws
              protocol: TCP
            - containerPort: 9090
              name: stats
              protocol: TCP
          volumeMounts:
            - name: haproxy-config
              mountPath: /usr/local/etc/haproxy/haproxy.cfg
              subPath: haproxy.cfg
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /stats
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /stats
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: haproxy-config
          configMap:
            name: haproxy-config
      terminationGracePeriodSeconds: 15
