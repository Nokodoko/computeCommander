apiVersion: v1
kind: Service
metadata:
  name: api-server
  namespace: compute-commander
  labels:
    app: api-server
    app.kubernetes.io/part-of: compute-commander
spec:
  type: ClusterIP
  selector:
    app: api-server
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
