  #tooltip .type { color: #ff6688; }
  svg { width: 100vw; height: 100vh; }
  .link { stroke-opacity: 0.4; }
  .link-label { font-size: 16px; fill: #888; pointer-events: none; }

const colorMap = {
  'SoftwareApplication': '#00ff88',
  'WebAPI': '#ff6688',
  'Dataset': '#ffaa00',
  'literal': '#4488cc',
};

function nodeColor(d) {
  if (d.type === 'literal') return '#4488cc';
  // Check if it's a schema type node
  if (d.id.startsWith('https://schema.org/')) return '#ff6688';
  return '#00ff88';
}

function nodeRadius(d) {
  if (d.type === 'literal') return 10;
  if (d.id.startsWith('https://schema.org/')) return 14;
  return 18;
}

let showLabels = true;
let showEdgeLabels = false;
let showLiterals = true;

const width = window.innerWidth;
const height = window.innerHeight;

const svg = d3.select('svg');
const g = svg.append('g');

const zoom = d3.zoom()
  .scaleExtent([0.1, 8])
  .on('zoom', (e) => g.attr('transform', e.transform));
svg.call(zoom);

function getFilteredData() {
  if (showLiterals) return graphData;
  const filteredNodes = graphData.nodes.filter(n => n.type !== 'literal');
  const nodeIds = new Set(filteredNodes.map(n => n.id));
  const filteredLinks = graphData.links.filter(l => nodeIds.has(l.source.id || l.source) && nodeIds.has(l.target.id || l.target));
  return { nodes: filteredNodes, links: filteredLinks };
}

// Build simulation
const simulation = d3.forceSimulation(graphData.nodes)
  .force('link', d3.forceLink(graphData.links).id(d => d.id).distance(200))
  .force('charge', d3.forceManyBody().strength(-800))
  .force('center', d3.forceCenter(width / 2, height / 2))
  .force('collision', d3.forceCollide().radius(d => nodeRadius(d) + 30));

// Edge colors
function edgeColor(label) {
  const map = {
    'type': '#333',
    'label': '#333',
    'description': '#333',
    'uses': '#00ff8866',
    'provides': '#ffaa0066',
    'stores_in': '#ff668866',
    'connects': '#4488cc66',
    'integrates_with': '#aa66ff66',
    'monitors': '#ff884466',
  };
  return map[label] || '#2a2a4e';
}

// Draw
const link = g.append('g')
  .selectAll('line')
  .data(graphData.links)
  .join('line')
  .attr('class', 'link')
  .attr('stroke', d => edgeColor(d.label))
  .attr('stroke-width', d => ['type','label','description'].includes(d.label) ? 0.5 : 1.5);

const edgeLabelGroup = g.append('g')
  .selectAll('text')
  .data(graphData.links)
  .join('text')
  .attr('class', 'link-label')
  .text(d => d.label)
  .style('display', 'none');

const node = g.append('g')
  .selectAll('circle')
  .data(graphData.nodes)
  .join('circle')
  .attr('r', d => nodeRadius(d))
  .attr('fill', d => nodeColor(d))
  .attr('stroke', d => d3.color(nodeColor(d)).darker(0.5))
  .attr('stroke-width', 1)
  .attr('opacity', d => d.type === 'literal' ? 0.6 : 0.9)
  .call(d3.drag()
    .on('start', dragstarted)
    .on('drag', dragged)
    .on('end', dragended));

const label = g.append('g')
  .selectAll('text')
  .data(graphData.nodes)
  .join('text')
  .attr('class', 'node-label')
  .attr('dy', d => nodeRadius(d) + 24)
  .attr('fill', d => d.type === 'literal' ? '#4488cc88' : '#aaa')
  .text(d => d.label.length > 25 ? d.label.slice(0, 22) + '...' : d.label);

const tooltip = d3.select('#tooltip');

node.on('mouseover', (e, d) => {
  tooltip.style('display', 'block')
    .html(`<div class="type">${d.type}</div><div class="iri">${d.id}</div><div>${d.label}</div>`);
}).on('mousemove', (e) => {
  tooltip.style('left', (e.clientX + 15) + 'px').style('top', (e.clientY - 10) + 'px');
}).on('mouseout', () => tooltip.style('display', 'none'));

simulation.on('tick', () => {
  link
    .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  edgeLabelGroup
    .attr('x', d => (d.source.x + d.target.x) / 2)
    .attr('y', d => (d.source.y + d.target.y) / 2);
  node.attr('cx', d => d.x).attr('cy', d => d.y);
  label.attr('x', d => d.x).attr('y', d => d.y);
});

function dragstarted(e) { if (!e.active) simulation.alphaTarget(0.3).restart(); e.subject.fx = e.subject.x; e.subject.fy = e.subject.y; }
function dragged(e) { e.subject.fx = e.x; e.subject.fy = e.y; }
function dragended(e) { if (!e.active) simulation.alphaTarget(0); e.subject.fx = null; e.subject.fy = null; }

function toggleLabels() {
  showLabels = !showLabels;
  label.style('display', showLabels ? null : 'none');
  d3.select('#btn-labels').classed('active', showLabels);
}
function toggleEdgeLabels() {
  showEdgeLabels = !showEdgeLabels;
  edgeLabelGroup.style('display', showEdgeLabels ? null : 'none');
  d3.select('#btn-edge-labels').classed('active', showEdgeLabels);
}
function toggleLiterals() {
  showLiterals = !showLiterals;
  node.style('display', d => (!showLiterals && d.type === 'literal') ? 'none' : null);
  label.style('display', d => {
    if (!showLabels) return 'none';
    if (!showLiterals && d.type === 'literal') return 'none';
    return null;
  });
  link.style('display', d => {
    if (!showLiterals) {
      const s = typeof d.source === 'object' ? d.source : graphData.nodes.find(n => n.id === d.source);
      const t = typeof d.target === 'object' ? d.target : graphData.nodes.find(n => n.id === d.target);
      if ((s && s.type === 'literal') || (t && t.type === 'literal')) return 'none';
    }
    return null;
  });
  edgeLabelGroup.style('display', d => {
    if (!showEdgeLabels) return 'none';
    if (!showLiterals) {
      const s = typeof d.source === 'object' ? d.source : graphData.nodes.find(n => n.id === d.source);
      const t = typeof d.target === 'object' ? d.target : graphData.nodes.find(n => n.id === d.target);
      if ((s && s.type === 'literal') || (t && t.type === 'literal')) return 'none';
    }
    return null;
  });
  d3.select('#btn-literals').classed('active', showLiterals);
}
function resetZoom() { svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity); }

// Auto-zoom to fit after simulation settles
simulation.on('end', () => {
  const bounds = g.node().getBBox();
  const fullWidth = width, fullHeight = height;
  const bw = bounds.width, bh = bounds.height;
  const midX = bounds.x + bw / 2, midY = bounds.y + bh / 2;
  const scale = 0.85 / Math.max(bw / fullWidth, bh / fullHeight);
  const tx = fullWidth / 2 - scale * midX, ty = fullHeight / 2 - scale * midY;
  svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
});

d3.select('#stats').text(`${graphData.nodes.length} nodes, ${graphData.links.length} edges`);
</script>
</body>
</html>
