<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TrustGraph</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; color: #c0c0c0; font-family: monospace; overflow: hidden; font-size: 9px; }
  #header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    padding: 2px 6px; background: rgba(10,10,15,0.95);
    border-bottom: 1px solid #1a1a2e;
    display: flex; align-items: center; gap: 8px; height: 16px;
  }
  #header h1 { font-size: 9px; color: #00ff88; font-weight: 600; letter-spacing: 1px; }
  #header .stats { font-size: 9px; color: #555; }
  #status { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  #status.ok { background: #00ff88; }
  #status.err { background: #ff4444; }
  #status.stale { background: #ffaa00; }
  #sidebar {
    position: fixed; top: 16px; right: 0; width: 120px; bottom: 0;
    background: rgba(10,10,15,0.92); border-left: 1px solid #1a1a2e;
    overflow-y: auto; padding: 4px;
    z-index: 5;
  }
  @media (max-width: 600px) {
    #sidebar { width: 0; padding: 0; border-left: none; display: none; }
  }
  #sidebar h2 { font-size: 8px; color: #555; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
  .event-item {
    font-size: 8px; padding: 2px 0; border-bottom: 1px solid #111;
    word-break: break-word; line-height: 1.3;
  }
  .event-item .host-lewis { color: #ffaa00; font-weight: bold; }
  .event-item .host-monty { color: #00aaff; font-weight: bold; }
  .event-item .host-unknown { color: #888; }
  .event-item .ts { color: #444; }
  .event-item .summary { color: #888; }
  #empty {
    position: fixed; top: 16px; left: 0; right: 120px; bottom: 0;
    display: flex; align-items: center; justify-content: center;
    color: #333; font-size: 10px;
  }
  svg { position: fixed; top: 16px; left: 0; width: calc(100vw - 120px); height: calc(100vh - 16px); }
  @media (max-width: 600px) {
    #empty { right: 0; }
    svg { width: 100vw; }
  }
  .link {
    stroke: #333;
    stroke-opacity: 0.4;
    stroke-dasharray: 4 6;
    animation: trace 1.6s linear infinite;
    fill: none;
  }
  .axis-line {
    stroke: #333; stroke-width: 0.8; stroke-opacity: 0.5;
    stroke-dasharray: 1 3;
  }
  .axis-label {
    font-size: 7px; fill: #888888; opacity: 0.6;
    pointer-events: none;
  }
  #expand-btn {
    cursor: pointer; color: #ffaa00; opacity: 0.9;
    text-decoration: underline; padding: 0 4px;
  }
  #expand-btn:hover { color: #FFB347; }
  .link.lewis { stroke: #ffaa00; }
  .link.monty { stroke: #00aaff; }
  /* Edges that connect two nodes referenced by the most recent prompt/event. */
  .link.active {
    stroke: #ffaa00;
    stroke-opacity: 0.95;
    stroke-width: 1.6;
    stroke-dasharray: 6 3;
    animation: trace 0.8s linear infinite, pulse-amber 1.4s ease-in-out infinite;
  }
  @keyframes pulse-amber {
    0%, 100% { stroke-opacity: 0.6; }
    50%      { stroke-opacity: 1.0; }
  }
  /* When hovering a node, dim non-neighboring edges/nodes. */
  .dim { opacity: 0.12 !important; }
  .neighbor-edge {
    stroke: #ffaa00 !important;
    stroke-opacity: 1 !important;
    stroke-width: 1.4 !important;
  }
  @keyframes trace {
    from { stroke-dashoffset: 20; }
    to   { stroke-dashoffset: 0; }
  }
  .node-label { font-size: 8px; pointer-events: none; text-anchor: middle; fill: #888888; }
</style>
</head>
<body>
<div id="header">
  <div id="status" class="err"></div>
  <h1>TrustGraph</h1>
  <span class="stats" id="stats">connecting...</span>
  <span id="expand-btn" title="show more nodes"></span>
</div>
<div id="sidebar">
  <h2>Live Events</h2>
  <div id="event-list"></div>
</div>
<div id="empty">Waiting for graph data...</div>
<svg></svg>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
// ── Config ────────────────────────────────────────────────────────────────────
const SSE_URL   = 'http://monty:8202/events/memories?api_key=54c6862ad97a750e8743ab904e5abf14';
const GATEWAY   = (new URLSearchParams(location.search).get('gw') || 'http://localhost:8088') + '/api/v1/flow/default/service/triples';
const POLL_MS   = 30000; // poll TG gateway as fallback every 30s
const MAX_EVENTS_SIDEBAR = 40;
const RECENT_PROMPTS = 5;       // # recent prompts whose entities define the visible subgraph
const MAX_HOPS       = 2;       // BFS depth from focus when expanding the visible neighborhood
const TARGETED_CAP   = 30;      // hard cap on nodes in the default targeted view (prompt seeds + 1-hop)
const PLACEHOLDER_K  = 12;      // node count when no recent prompts exist (top-degree fallback)
let   TOP_K          = 30;      // semantic LOD: render up to this many nodes (mutated by Expand btn)
const TOP_K_STEP     = 50;      // expand by this many on header click
let   expandedMode   = false;   // user opted in to the larger exploded view via Expand
const LOD_LABEL      = 1.4;     // zoom scale above which we render labels
const LOD_HIGH_DEG   = 0.7;     // zoom scale below which we show only top-degree labels

// ── State ─────────────────────────────────────────────────────────────────────
let graphData    = null;       // last rendered graph {nodes, links}
let sseConnected = false;
let tgConnected  = false;
let eventCount   = { lewis: 0, monty: 0, total: 0 };
let sseEvents    = [];         // ring buffer for sidebar
let activityNodes = new Map(); // iri -> { count, lastHost, lastTs }
let lastEventTags = new Set(); // tags from the most recent SSE prompt/event
let recentPromptSets = [];     // ring buffer of last RECENT_PROMPTS Sets
let sim = null;
let svgG = null;
let lastLinkSel = null;        // remembered selection so SSE can re-class active edges
let dormantCount = 0;          // # nodes hidden by the recent-prompts filter

const statusEl    = document.getElementById('status');
const statsEl     = document.getElementById('stats');
const emptyEl     = document.getElementById('empty');
const eventListEl = document.getElementById('event-list');

function shortLabel(iri) {
  if (!iri) return '';
  if (iri.startsWith('lit:')) return iri.slice(4);
  const hash = iri.lastIndexOf('#');
  if (hash >= 0) return iri.slice(hash + 1);
  const slash = iri.lastIndexOf('/');
  if (slash >= 0) return iri.slice(slash + 1);
  return iri;
}

// True when a node's display label is an opaque blob (hash, UUID, hex digest,
// base64-ish chunk, etc.) and contributes no semantic value to the viewer.
// Filters: pure-hex >=8 chars, UUID, base64-ish >=20 chars w/o words, raw
// numeric IDs >=10 chars, and labels that are 24+ chars with no separator
// (URN-style opaque IDs).
const HEX_RE   = /^[0-9a-fA-F]{8,}$/;
const UUID_RE  = /^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$/;
const NUM_RE   = /^[0-9]{10,}$/;
const B64_RE   = /^[A-Za-z0-9+/_-]{20,}={0,2}$/;
function isOpaqueLabel(s) {
  if (!s) return true;
  const t = String(s).trim();
  if (t.length < 4) return false;
  if (UUID_RE.test(t)) return true;
  if (HEX_RE.test(t)) return true;
  if (NUM_RE.test(t)) return true;
  // base64-style: long, no spaces, no separators, no vowel runs
  if (t.length >= 20 && B64_RE.test(t) && !/[\s_.\-]/.test(t) && !/[aeiouAEIOU]{2}/.test(t)) return true;
  return false;
}

function extractHost(tags) {
  if (!Array.isArray(tags)) return 'unknown';
  for (const t of tags) {
    if (t.startsWith('host:')) return t.slice(5);
  }
  return 'unknown';
}

function hostClass(host) {
  if (host === 'lewis') return 'host-lewis';
  if (host === 'monty') return 'host-monty';
  return 'host-unknown';
}

// ── SSE Event Processing ──────────────────────────────────────────────────────

function handleMemoryEvent(ev) {
  const host = extractHost(ev.entities && ev.entities.tags);
  const ts   = ev.captured_at ? new Date(ev.captured_at) : new Date();

  eventCount.total++;
  if (host === 'lewis') eventCount.lewis++;
  else if (host === 'monty') eventCount.monty++;

  // Push to sidebar ring buffer.
  sseEvents.push({ host, ts, summary: ev.raw_content || ev.item_type || '' });
  if (sseEvents.length > MAX_EVENTS_SIDEBAR) sseEvents.shift();

  // Extract entity labels from tags for graph activity nodes.
  const tags = (ev.entities && ev.entities.tags) || [];
  const promptTags = new Set();
  for (const tag of tags) {
    if (tag.startsWith('host:') || tag.startsWith('source:')) continue;
    promptTags.add(tag);
    const existing = activityNodes.get(tag);
    if (existing) {
      existing.count++;
      existing.lastHost = host;
      existing.lastTs = ts;
    } else {
      activityNodes.set(tag, { count: 1, lastHost: host, lastTs: ts, label: tag });
    }
  }

  // Mark the connected nodes from this prompt; render highlights edges
  // between them. Auto-clear after 12s so the active set decays.
  lastEventTags = promptTags;
  refreshActiveEdges();
  clearTimeout(handleMemoryEvent._decay);
  handleMemoryEvent._decay = setTimeout(() => {
    lastEventTags = new Set();
    refreshActiveEdges();
  }, 12000);

  // Push to recent-prompt ring buffer so the radial filter expands the
  // visible subgraph to include this prompt's entities.
  if (promptTags.size) {
    recentPromptSets.push(promptTags);
    if (recentPromptSets.length > RECENT_PROMPTS) recentPromptSets.shift();
    // Re-render the TG graph so newly relevant nodes appear (debounced).
    if (graphData) scheduleRender(graphData);
  }

  updateStatus();
  renderSidebar();
}

function updateStatus() {
  if (sseConnected) {
    statusEl.className = 'ok';
    statsEl.textContent = `sse live | l:${eventCount.lewis} m:${eventCount.monty} t:${eventCount.total}`;
  } else if (tgConnected && graphData) {
    statusEl.className = 'stale';
    const n = graphData.nodes.length;
    statsEl.textContent = `sse offline | tg: ${n} nodes`;
  } else {
    statusEl.className = 'err';
    statsEl.textContent = 'connecting...';
  }

  const expandEl = document.getElementById('expand-btn');
  if (expandEl) {
    if (!expandedMode && dormantCount > 0) {
      expandEl.textContent = `expand (+${dormantCount})  ▼`;
      expandEl.style.display = '';
    } else if (expandedMode) {
      expandEl.textContent = `targeted view  ▲`;
      expandEl.style.display = '';
    } else {
      expandEl.style.display = 'none';
    }
  }
}

// Wire the expand button: toggles between targeted (default) and exploded view.
// In exploded mode, repeated clicks bump TOP_K; second click after entering
// exploded mode collapses back to targeted.
document.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('expand-btn');
  if (!btn) return;
  btn.addEventListener('click', () => {
    if (!expandedMode) {
      expandedMode = true;
      TOP_K = 80;
    } else {
      // Already exploded — either bump higher, or collapse if we're already big.
      if (TOP_K >= 250) {
        expandedMode = false;
        TOP_K = 30;
      } else {
        TOP_K = Math.min(250, TOP_K + TOP_K_STEP);
      }
    }
    lastNodeSetKey = '';
    if (graphData) renderD3Graph(graphData);
    updateStatus();
  });
});

function renderSidebar() {
  const items = sseEvents.slice().reverse(); // newest first
  eventListEl.innerHTML = items.map(e => {
    const hc   = hostClass(e.host);
    const time = e.ts.toTimeString().slice(0, 8);
    const summ = (e.summary || '').slice(0, 80);
    return `<div class="event-item">
      <span class="${hc}">${e.host}</span>
      <span class="ts"> ${time}</span><br>
      <span class="summary">${summ}</span>
    </div>`;
  }).join('');
}

// ── Activity Graph (from SSE tags) ────────────────────────────────────────────

function nodeColor(d) {
  // SSE activity nodes (live multi-host events) keep host-based hues.
  if (d.host === 'lewis') return '#ffaa00'; // amber
  if (d.host === 'monty') return '#00aaff'; // cyan secondary
  // TG gateway nodes — amber palette.
  if (d.focus) return '#ffaa00';              // amber focus
  if (d.type === 'literal') return '#FFB347'; // light amber literals
  return '#888888';                           // inactive gray entities
}

function nodeRadius(d) {
  // LOD mode: ALL nodes render, so keep base radius small. Degree boosts
  // important nodes; focus gets a small bonus. Stroke scaling at zoom
  // time visually inflates these without re-laying out.
  const base = 2 + Math.min(Math.sqrt((d.degree || d.count || 1)) * 0.9, 5);
  return d.focus ? base + 1.5 : base;
}

// True when a node id/label intersects the latest prompt's tag set.
// SSE tag strings are short labels (e.g. "langchaingo") while TG node IDs
// are full IRIs (e.g. "http://example/langchaingo"). Compare both forms.
function nodeMatchesPrompt(n) {
  if (!lastEventTags.size || !n) return false;
  const id    = n.id || '';
  const label = n.label || shortLabel(id);
  if (lastEventTags.has(id) || lastEventTags.has(label)) return true;
  for (const t of lastEventTags) {
    if (!t) continue;
    if (id.endsWith('/' + t) || id.endsWith('#' + t)) return true;
    if (label.toLowerCase() === t.toLowerCase()) return true;
  }
  return false;
}

// Classify an edge: gets a host class if either endpoint is host-tagged,
// and `active` if BOTH endpoints are referenced by the most recent prompt.
function baseLinkClass(d) {
  const s = d.source, t = d.target;
  const sh = (s && s.host) || '';
  const th = (t && t.host) || '';
  let cls = 'link';
  if (sh === 'lewis' || th === 'lewis') cls += ' lewis';
  else if (sh === 'monty' || th === 'monty') cls += ' monty';
  if (nodeMatchesPrompt(s) && nodeMatchesPrompt(t)) cls += ' active';
  return cls;
}

function refreshActiveEdges() {
  if (!lastLinkSel) return;
  lastLinkSel.attr('class', d => baseLinkClass(d));
}

// Highlight a node's 1-hop neighborhood; dim everything else.
function highlightNeighborhood(node, nodeSel, linkSel) {
  const neighbors = new Set([node.id]);
  linkSel.each(d => {
    const sId = (d.source && d.source.id) || d.source;
    const tId = (d.target && d.target.id) || d.target;
    if (sId === node.id) neighbors.add(tId);
    if (tId === node.id) neighbors.add(sId);
  });
  nodeSel.classed('dim', d => !neighbors.has(d.id));
  linkSel.each(function(d) {
    const sId = (d.source && d.source.id) || d.source;
    const tId = (d.target && d.target.id) || d.target;
    const touches = sId === node.id || tId === node.id;
    d3.select(this)
      .classed('dim', !touches)
      .classed('neighbor-edge', touches);
  });
}

function clearHighlight(nodeSel, linkSel) {
  nodeSel.classed('dim', false);
  linkSel.classed('dim', false).classed('neighbor-edge', false);
}

// Default view = TARGETED: only nodes referenced by recent prompts plus their
// immediate (1-hop) neighbors, hard-capped at TARGETED_CAP. When the user
// clicks Expand, the view switches to the legacy exploded view (top-degree
// up to TOP_K). When no recent prompts exist, show a tiny PLACEHOLDER_K-sized
// top-degree set instead of the full graph.
function filterRecentSubgraph(full) {
  if (!full || !full.nodes.length) return { nodes: [], links: [], focus: null };

  // Build adjacency once; used by both modes.
  const adj = new Map();
  for (const n of full.nodes) adj.set(n.id, new Set());
  for (const l of full.links) {
    const sId = (l.source && l.source.id) || l.source;
    const tId = (l.target && l.target.id) || l.target;
    if (adj.has(sId) && adj.has(tId)) {
      adj.get(sId).add(tId);
      adj.get(tId).add(sId);
    }
  }

  // Drop opaque-label nodes (hashes, UUIDs, raw hex digests) — they pollute
  // any selection (targeted or expanded) and add no semantic value.
  const meaningful = full.nodes.filter(n => {
    const lbl = n.label || shortLabel(n.id);
    return !isOpaqueLabel(lbl);
  });
  const meaningfulIds = new Set(meaningful.map(n => n.id));
  const byId = new Map(meaningful.map(n => [n.id, n]));

  // Resolve recent-prompt tag set to actual node ids in the graph.
  const promptIds = new Set();
  for (const s of recentPromptSets) for (const t of s) promptIds.add(t);

  function matchesPrompt(n) {
    if (promptIds.has(n.id)) return true;
    const lbl = (n.label || shortLabel(n.id)).toLowerCase();
    for (const t of promptIds) {
      if (!t) continue;
      const tl = t.toLowerCase();
      if (lbl === tl) return true;
      if (n.id.endsWith('/' + t) || n.id.endsWith('#' + t)) return true;
    }
    return false;
  }

  const seedIds = new Set();
  for (const n of meaningful) if (matchesPrompt(n)) seedIds.add(n.id);

  let visibleArr;

  if (expandedMode) {
    // Exploded view: prompt-touched first, then top-degree fillers up to TOP_K.
    const scored = meaningful.map(n => ({
      n,
      deg: adj.get(n.id).size,
      prompt: seedIds.has(n.id),
    }));
    scored.sort((a, b) => {
      if (a.prompt !== b.prompt) return a.prompt ? -1 : 1;
      return b.deg - a.deg;
    });
    visibleArr = scored.slice(0, TOP_K).map(x => x.n);
  } else if (seedIds.size === 0) {
    // No recent prompts → tiny placeholder so we don't render the firehose.
    const scored = meaningful.map(n => ({ n, deg: adj.get(n.id).size }));
    scored.sort((a, b) => b.deg - a.deg);
    visibleArr = scored.slice(0, PLACEHOLDER_K).map(x => x.n);
  } else {
    // Targeted view: seed set + 1-hop meaningful neighbors, capped at TARGETED_CAP.
    const visibleSet = new Set(seedIds);
    // Rank candidate neighbors by degree so the cap keeps the most-connected ones.
    const candidates = [];
    for (const sid of seedIds) {
      const neigh = adj.get(sid);
      if (!neigh) continue;
      for (const nid of neigh) {
        if (visibleSet.has(nid)) continue;
        if (!meaningfulIds.has(nid)) continue;
        candidates.push({ id: nid, deg: adj.get(nid).size });
      }
    }
    candidates.sort((a, b) => b.deg - a.deg);
    for (const c of candidates) {
      if (visibleSet.size >= TARGETED_CAP) break;
      visibleSet.add(c.id);
    }
    visibleArr = [];
    for (const id of visibleSet) {
      const n = byId.get(id);
      if (n) visibleArr.push(n);
    }
  }

  const visible = new Set(visibleArr.map(n => n.id));
  const nodes = visibleArr;
  const links = full.links.filter(l => {
    const sId = (l.source && l.source.id) || l.source;
    const tId = (l.target && l.target.id) || l.target;
    return visible.has(sId) && visible.has(tId);
  });

  // Focus: prefer a seed node (highest-degree seed) so radial layout centers
  // on the prompt; fall back to the highest-degree visible node otherwise.
  let focus = null;
  if (seedIds.size) {
    let bestDeg = -1;
    for (const id of seedIds) {
      if (!visible.has(id)) continue;
      const d = adj.get(id).size;
      if (d > bestDeg) { bestDeg = d; focus = id; }
    }
  }
  if (!focus && nodes.length) {
    let bestDeg = -1;
    for (const n of nodes) {
      const d = adj.get(n.id).size;
      if (d > bestDeg) { bestDeg = d; focus = n.id; }
    }
  }
  dormantCount = full.nodes.length - nodes.length;
  return { nodes, links, focus };
}

// Pre-position nodes in concentric rings keyed by hop distance from focus.
function radialPrePosition(nodes, focus, ringByNode, w, h) {
  const cx = w / 2, cy = h / 2;
  const minDim = Math.min(w, h);
  const ringStep = Math.max(28, (minDim / 2 - 16) / (MAX_HOPS + 0.5));
  // Group nodes by ring.
  const byRing = new Map();
  for (const n of nodes) {
    const r = (n.id === focus) ? 0 : (ringByNode.get(n.id) || 1);
    if (!byRing.has(r)) byRing.set(r, []);
    byRing.get(r).push(n);
  }
  for (const [ring, list] of byRing) {
    if (ring === 0) {
      list.forEach(n => { n.x = cx; n.y = cy; n.fx = cx; n.fy = cy; });
      continue;
    }
    const radius = ring * ringStep;
    const step   = (Math.PI * 2) / Math.max(1, list.length);
    list.forEach((n, i) => {
      const angle = i * step;
      n.x = cx + Math.cos(angle) * radius;
      n.y = cy + Math.sin(angle) * radius;
    });
  }
}

function triplesToGraph(triples) {
  const nodeMap = new Map();
  const links = [];

  function termValue(term) {
    if (!term) return '';
    if (typeof term === 'string') return term;
    if (term.t === 'l') return 'lit:' + (term.v || '');
    return term.i || term.v || '';
  }

  function addNode(iri) {
    if (nodeMap.has(iri)) return nodeMap.get(iri);
    const isLiteral = iri.startsWith('lit:') || !iri.startsWith('http');
    const n = { id: iri, label: shortLabel(iri), type: isLiteral ? 'literal' : 'entity', host: 'tg', count: 1 };
    nodeMap.set(iri, n);
    return n;
  }

  for (const t of triples) {
    const s = t.s || t.subject;
    const p = t.p || t.predicate;
    const o = t.o || t.object;
    if (!s || !p || !o) continue;
    const sv = termValue(s);
    const ov = termValue(o);
    const pv = termValue(p);
    if (!sv || !ov) continue;
    addNode(sv);
    addNode(ov);
    links.push({ source: sv, target: ov, label: shortLabel(pv) });
  }

  return { nodes: [...nodeMap.values()], links };
}

const svg  = d3.select('svg');
svgG = svg.append('g');

// ── Debounced render scheduler ───────────────────────────────────────────────
// Coalesce SSE-triggered and resize-triggered render calls. If the visible
// node set hasn't changed since the last full rebuild, skip the simulation
// rebuild and just refresh which edges are highlighted as "active".
let renderTimer = null;
let lastNodeSetKey = '';
const RENDER_DEBOUNCE_MS = 2000;

function visibleNodeSetKey(gd) {
  if (!gd || !gd.nodes) return '';
  const filtered = filterRecentSubgraph(gd);
  const ids = filtered.nodes.map(n => n.id);
  ids.sort();
  return ids.join('|');
}

function scheduleRender(gd) {
  if (!gd) return;
  if (renderTimer) return; // already scheduled
  renderTimer = setTimeout(() => {
    renderTimer = null;
    if (!graphData) return;
    const key = visibleNodeSetKey(graphData);
    if (key && key === lastNodeSetKey && lastLinkSel) {
      // Node set unchanged — skip full rebuild, just re-classify active edges.
      refreshActiveEdges();
      return;
    }
    renderD3Graph(graphData); // updates lastNodeSetKey itself
  }, RENDER_DEBOUNCE_MS);
}

function renderD3Graph(gd) {
  emptyEl.style.display = 'none';
  if (sim) sim.stop();

  // Memo the visible node-set key so scheduleRender can skip rebuilds when
  // the next event/poll resolves to the same set of visible nodes.
  lastNodeSetKey = visibleNodeSetKey(gd);

  const filtered = filterRecentSubgraph(gd);
  const focus    = filtered.focus;
  const nodes    = filtered.nodes.map(d => Object.assign({}, d, { focus: d.id === focus }));
  const nodeById = new Map(nodes.map(n => [n.id, n]));
  const links    = filtered.links
    .map(d => {
      const sObj = (d.source && d.source.id) ? nodeById.get(d.source.id) : nodeById.get(d.source);
      const tObj = (d.target && d.target.id) ? nodeById.get(d.target.id) : nodeById.get(d.target);
      return sObj && tObj ? { ...d, source: sObj.id, target: tObj.id } : null;
    })
    .filter(Boolean);

  // Compute degree on the visible subgraph for radius / LOD decisions.
  const degMap = new Map();
  for (const n of nodes) degMap.set(n.id, 0);
  for (const l of links) {
    degMap.set(l.source, (degMap.get(l.source) || 0) + 1);
    degMap.set(l.target, (degMap.get(l.target) || 0) + 1);
  }
  for (const n of nodes) n.degree = degMap.get(n.id) || 0;
  // Threshold: top 25% by degree are considered "high importance" for LOD labels.
  const sortedDegs = nodes.map(n => n.degree).sort((a, b) => b - a);
  const highDegThreshold = sortedDegs[Math.max(0, Math.floor(sortedDegs.length * 0.25))] || 0;

  svgG.selectAll('*').remove();
  svgG.attr('transform', null);

  const sbW = (window.innerWidth <= 600) ? 0 : 120;
  const w = window.innerWidth - sbW;
  const h = window.innerHeight - 16;
  const minDim = Math.min(w, h);

  // Tighter forces — we want the full graph to fit at the initial zoom-out.
  const linkDist = Math.max(10, Math.min(28, minDim / 14));
  const charge   = -Math.max(15, Math.min(60, minDim / 9));
  const pad      = 2;

  const linkSel = svgG.append('g').attr('class', 'links')
    .selectAll('line')
    .data(links)
    .join('line')
    .attr('class', d => baseLinkClass(d))
    .attr('stroke-width', 0.7);
  lastLinkSel = linkSel;

  const nodeSel = svgG.append('g').attr('class', 'nodes')
    .selectAll('circle')
    .data(nodes)
    .join('circle')
    .attr('class', 'node')
    .attr('r', d => nodeRadius(d))
    .attr('fill', d => nodeColor(d))
    .attr('opacity', 0.85)
    .on('mouseover', (e, d) => highlightNeighborhood(d, nodeSel, linkSel))
    .on('mouseout',  ()    => clearHighlight(nodeSel, linkSel))
    .on('click', (e, d) => zoomToNode(d));

  const labelSel = svgG.append('g').attr('class', 'labels')
    .selectAll('text')
    .data(nodes)
    .join('text')
    .attr('class', 'node-label')
    .attr('dy', d => nodeRadius(d) + 7)
    .text(d => (d.label || shortLabel(d.id)).slice(0, 18))
    .style('display', 'none'); // initially hidden until zoomed in

  sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(linkDist).strength(0.5))
    .force('charge', d3.forceManyBody().strength(charge))
    .force('center', d3.forceCenter(w / 2, h / 2))
    .force('collision', d3.forceCollide().radius(d => nodeRadius(d) + 1.5))
    .alphaDecay(0.045)
    .velocityDecay(0.5);

  sim.on('tick', () => {
    nodes.forEach(d => {
      const r = nodeRadius(d) + pad;
      d.x = Math.max(r, Math.min(w - r, d.x));
      d.y = Math.max(r, Math.min(h - r, d.y));
    });
    linkSel
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    nodeSel.attr('cx', d => d.x).attr('cy', d => d.y);
    labelSel.attr('x', d => d.x).attr('y', d => d.y);
  });

  // ── d3.zoom + semantic LOD ─────────────────────────────────────────────────
  // Apply zoom transforms to svgG, and adjust visual properties based on the
  // current zoom scale (label visibility, stroke widths) so the graph stays
  // legible whether you're at 0.4× (fit-to-pane overview) or 6× (entity detail).
  const zoomBehavior = d3.zoom()
    .scaleExtent([0.3, 8])
    .on('zoom', (event) => {
      const t = event.transform;
      svgG.attr('transform', t);
      applyLOD(t.k);
    });
  svg.call(zoomBehavior).on('dblclick.zoom', null); // dbl-click = reset, see below
  svg.on('dblclick', () => {
    svg.transition().duration(500).call(zoomBehavior.transform, d3.zoomIdentity);
    autoFit();
  });

  function applyLOD(k) {
    // Edges become hairline at high zoom so labels and nodes remain readable.
    linkSel.attr('stroke-width', Math.max(0.5, 1.1 / k));
    // Show labels when zoomed in; show only high-degree labels at medium zoom.
    labelSel.style('display', d => {
      if (k >= LOD_LABEL) return null;
      if (k >= LOD_HIGH_DEG && d.degree >= highDegThreshold) return null;
      return 'none';
    });
    // Counter-scale label font so it stays readable at all zoom levels.
    labelSel.style('font-size', `${Math.max(6, 8 / Math.sqrt(k))}px`);
  }
  applyLOD(1);

  // Click a node → smoothly zoom + center on its neighborhood.
  function zoomToNode(d) {
    if (!d || d.x == null) return;
    const targetK = 3.5;
    const tx = w / 2 - d.x * targetK;
    const ty = h / 2 - d.y * targetK;
    svg.transition().duration(600)
       .call(zoomBehavior.transform,
             d3.zoomIdentity.translate(tx, ty).scale(targetK));
  }

  // Initial fit-to-pane: compute bbox after settle, transform via zoomBehavior
  // so subsequent user pan/zoom continues from this anchor.
  function autoFit() {
    if (!nodes.length) return;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    nodes.forEach(d => {
      const r = nodeRadius(d) + 6;
      if (d.x - r < minX) minX = d.x - r;
      if (d.y - r < minY) minY = d.y - r;
      if (d.x + r > maxX) maxX = d.x + r;
      if (d.y + r > maxY) maxY = d.y + r;
    });
    const bw = Math.max(1, maxX - minX);
    const bh = Math.max(1, maxY - minY);
    const margin = 12;
    const scale = Math.min((w - margin * 2) / bw, (h - margin * 2) / bh, 1);
    const tx = margin + (w - margin * 2 - bw * scale) / 2 - minX * scale;
    const ty = margin + (h - margin * 2 - bh * scale) / 2 - minY * scale;
    svg.transition().duration(400)
       .call(zoomBehavior.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
  }

  setTimeout(autoFit, 900);
  setTimeout(autoFit, 1700);
  setTimeout(() => { if (sim) sim.stop(); autoFit(); }, 2600);
}

// Re-render on resize so sidebar/forces re-fit when the pane changes size.
// Resize requires a full rebuild (forces depend on w/h), so invalidate the
// node-set memo and call renderD3Graph directly (bypassing the debounce).
let resizeT;
window.addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    if (!graphData) return;
    lastNodeSetKey = '';
    renderD3Graph(graphData);
  }, 200);
});

// ── SSE Connection ────────────────────────────────────────────────────────────

function connectSSE() {
  const es = new EventSource(SSE_URL);

  es.addEventListener('memory', (e) => {
    try {
      const ev = JSON.parse(e.data);
      // Attach tags for co-occurrence in sidebar rendering.
      const tags = (ev.entities && ev.entities.tags) || [];
      ev._tags = tags;
      handleMemoryEvent(ev);
      // Store tags on the sidebar entry.
      if (sseEvents.length > 0) {
        sseEvents[sseEvents.length - 1].tags = tags;
      }
    } catch (err) {
      console.warn('sse parse error:', err);
    }
  });

  es.onopen = () => {
    sseConnected = true;
    updateStatus();
  };

  es.onerror = () => {
    sseConnected = false;
    updateStatus();
    // EventSource reconnects automatically per spec.
  };
}

// ── TG Gateway Fallback Poll ──────────────────────────────────────────────────

async function fetchTGGraph() {
  try {
    const res = await fetch(GATEWAY, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ limit: 200 }),
      signal: AbortSignal.timeout(5000),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    const triples = Array.isArray(data) ? data : (data.response || data.triples || data.results || []);
    const graph   = triplesToGraph(triples);

    tgConnected = true;
    graphData   = graph;

    // Re-render the TG gateway graph on poll. Debounced + skip-rebuild
    // when the visible node set is unchanged so the simulation can settle.
    if (graph.nodes.length > 0) {
      scheduleRender(graph);
    }
    updateStatus();
  } catch (e) {
    tgConnected = false;
    updateStatus();
  }
}

// ── Bootstrap ─────────────────────────────────────────────────────────────────

connectSSE();
fetchTGGraph();
setInterval(fetchTGGraph, POLL_MS);
</script>
