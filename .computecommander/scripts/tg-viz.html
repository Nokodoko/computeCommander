<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TrustGraph</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; color: #c0c0c0; font-family: monospace; overflow: hidden; font-size: 9px; }
  #header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    padding: 2px 6px; background: rgba(10,10,15,0.95);
    border-bottom: 1px solid #1a1a2e;
    display: flex; align-items: center; gap: 8px; height: 16px;
  }
  #header h1 { font-size: 9px; color: #00ff88; font-weight: 600; letter-spacing: 1px; }
  #header .stats { font-size: 9px; color: #555; }
  #status { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  #status.ok { background: #00ff88; }
  #status.err { background: #ff4444; }
  #status.stale { background: #ffaa00; }
  #sidebar {
    position: fixed; top: 16px; right: 0; width: 180px; bottom: 0;
    background: rgba(10,10,15,0.92); border-left: 1px solid #1a1a2e;
    overflow-y: auto; padding: 4px;
    z-index: 5;
  }
  #sidebar h2 { font-size: 8px; color: #555; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
  .event-item {
    font-size: 8px; padding: 2px 0; border-bottom: 1px solid #111;
    word-break: break-word; line-height: 1.3;
  }
  .event-item .host-lewis { color: #ffaa00; font-weight: bold; }
  .event-item .host-monty { color: #00aaff; font-weight: bold; }
  .event-item .host-unknown { color: #888; }
  .event-item .ts { color: #444; }
  .event-item .summary { color: #888; }
  #empty {
    position: fixed; top: 16px; left: 0; right: 180px; bottom: 0;
    display: flex; align-items: center; justify-content: center;
    color: #333; font-size: 10px;
  }
  svg { position: fixed; top: 16px; left: 0; width: calc(100vw - 180px); height: calc(100vh - 16px); }
  .link { stroke-opacity: 0.4; }
  .node-label { font-size: 8px; pointer-events: none; text-anchor: middle; }
</style>
</head>
<body>
<div id="header">
  <div id="status" class="err"></div>
  <h1>TrustGraph</h1>
  <span class="stats" id="stats">connecting...</span>
</div>
<div id="sidebar">
  <h2>Live Events</h2>
  <div id="event-list"></div>
</div>
<div id="empty">Waiting for graph data...</div>
<svg></svg>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
// ── Config ────────────────────────────────────────────────────────────────────
const SSE_URL   = 'http://monty:8202/events/memories?api_key=54c6862ad97a750e8743ab904e5abf14';
const GATEWAY   = 'http://localhost:8088/api/v1/flow/default/service/triples';
const POLL_MS   = 30000; // poll TG gateway as fallback every 30s
const MAX_EVENTS_SIDEBAR = 40;

// ── State ─────────────────────────────────────────────────────────────────────
let graphData    = null;       // last rendered graph {nodes, links}
let sseConnected = false;
let tgConnected  = false;
let eventCount   = { lewis: 0, monty: 0, total: 0 };
let sseEvents    = [];         // ring buffer for sidebar
let activityNodes = new Map(); // iri -> { count, lastHost, lastTs }
let sim = null;
let svgG = null;

const statusEl    = document.getElementById('status');
const statsEl     = document.getElementById('stats');
const emptyEl     = document.getElementById('empty');
const eventListEl = document.getElementById('event-list');

function shortLabel(iri) {
  if (!iri) return '';
  if (iri.startsWith('lit:')) return iri.slice(4);
  const hash = iri.lastIndexOf('#');
  if (hash >= 0) return iri.slice(hash + 1);
  const slash = iri.lastIndexOf('/');
  if (slash >= 0) return iri.slice(slash + 1);
  return iri;
}

function extractHost(tags) {
  if (!Array.isArray(tags)) return 'unknown';
  for (const t of tags) {
    if (t.startsWith('host:')) return t.slice(5);
  }
  return 'unknown';
}

function hostClass(host) {
  if (host === 'lewis') return 'host-lewis';
  if (host === 'monty') return 'host-monty';
  return 'host-unknown';
}

// ── SSE Event Processing ──────────────────────────────────────────────────────

function handleMemoryEvent(ev) {
  const host = extractHost(ev.entities && ev.entities.tags);
  const ts   = ev.captured_at ? new Date(ev.captured_at) : new Date();

  eventCount.total++;
  if (host === 'lewis') eventCount.lewis++;
  else if (host === 'monty') eventCount.monty++;

  // Push to sidebar ring buffer.
  sseEvents.push({ host, ts, summary: ev.raw_content || ev.item_type || '' });
  if (sseEvents.length > MAX_EVENTS_SIDEBAR) sseEvents.shift();

  // Extract entity labels from tags for graph activity nodes.
  const tags = (ev.entities && ev.entities.tags) || [];
  for (const tag of tags) {
    if (tag.startsWith('host:') || tag.startsWith('source:')) continue;
    const existing = activityNodes.get(tag);
    if (existing) {
      existing.count++;
      existing.lastHost = host;
      existing.lastTs = ts;
    } else {
      activityNodes.set(tag, { count: 1, lastHost: host, lastTs: ts, label: tag });
    }
  }

  updateStatus();
  renderSidebar();
  renderActivityGraph();
}

function updateStatus() {
  if (sseConnected) {
    statusEl.className = 'ok';
    statsEl.textContent = `sse live | lewis:${eventCount.lewis} monty:${eventCount.monty} total:${eventCount.total}`;
  } else if (tgConnected && graphData) {
    statusEl.className = 'stale';
    const n = graphData.nodes.length;
    statsEl.textContent = `sse offline | tg: ${n} nodes`;
  } else {
    statusEl.className = 'err';
    statsEl.textContent = 'connecting...';
  }
}

function renderSidebar() {
  const items = sseEvents.slice().reverse(); // newest first
  eventListEl.innerHTML = items.map(e => {
    const hc   = hostClass(e.host);
    const time = e.ts.toTimeString().slice(0, 8);
    const summ = (e.summary || '').slice(0, 80);
    return `<div class="event-item">
      <span class="${hc}">${e.host}</span>
      <span class="ts"> ${time}</span><br>
      <span class="summary">${summ}</span>
    </div>`;
  }).join('');
}

// ── Activity Graph (from SSE tags) ────────────────────────────────────────────

function renderActivityGraph() {
  if (activityNodes.size === 0) return;
  emptyEl.style.display = 'none';

  // Build graph from activity node co-occurrence.
  // Nodes = distinct tags. Edges = tags that appeared in the same event.
  const nodes = [];
  for (const [id, info] of activityNodes) {
    nodes.push({
      id,
      label: id.length > 20 ? id.slice(0, 18) + '..' : id,
      count: info.count,
      host:  info.lastHost,
    });
  }

  // Sort by count, keep top 80 for readability.
  nodes.sort((a, b) => b.count - a.count);
  const topNodes = nodes.slice(0, 80);
  const nodeSet  = new Set(topNodes.map(n => n.id));

  // Simple links: nodes from the same event that are both in topNodes.
  // We approximate via sseEvents co-occurrence.
  const linkMap = new Map();
  for (const ev of sseEvents) {
    const tags = (ev.tags || []).filter(t => nodeSet.has(t));
    for (let i = 0; i < tags.length; i++) {
      for (let j = i + 1; j < tags.length; j++) {
        const key = tags[i] < tags[j] ? `${tags[i]}|${tags[j]}` : `${tags[j]}|${tags[i]}`;
        linkMap.set(key, (linkMap.get(key) || 0) + 1);
      }
    }
  }

  const links = [];
  for (const [key, weight] of linkMap) {
    const [s, t] = key.split('|');
    links.push({ source: s, target: t, weight });
  }

  renderD3Graph({ nodes: topNodes, links });
}

function nodeColor(d) {
  if (d.host === 'lewis') return '#ffaa00'; // amber
  if (d.host === 'monty') return '#00aaff'; // cyan
  return '#888888';
}

function nodeRadius(d) {
  return 3 + Math.min(Math.sqrt(d.count || 1) * 1.5, 10);
}

function triplesToGraph(triples) {
  const nodeMap = new Map();
  const links = [];

  function termValue(term) {
    if (!term) return '';
    if (typeof term === 'string') return term;
    if (term.t === 'l') return 'lit:' + (term.v || '');
    return term.i || term.v || '';
  }

  function addNode(iri) {
    if (nodeMap.has(iri)) return nodeMap.get(iri);
    const isLiteral = iri.startsWith('lit:') || !iri.startsWith('http');
    const n = { id: iri, label: shortLabel(iri), type: isLiteral ? 'literal' : 'entity', host: 'tg', count: 1 };
    nodeMap.set(iri, n);
    return n;
  }

  for (const t of triples) {
    const s = t.s || t.subject;
    const p = t.p || t.predicate;
    const o = t.o || t.object;
    if (!s || !p || !o) continue;
    const sv = termValue(s);
    const ov = termValue(o);
    const pv = termValue(p);
    if (!sv || !ov) continue;
    addNode(sv);
    addNode(ov);
    links.push({ source: sv, target: ov, label: shortLabel(pv) });
  }

  return { nodes: [...nodeMap.values()], links };
}

const svg  = d3.select('svg');
svgG = svg.append('g');

function renderD3Graph(gd) {
  emptyEl.style.display = 'none';
  if (sim) sim.stop();

  const nodes = gd.nodes.map(d => Object.assign({}, d));
  const links = gd.links.map(d => ({ ...d }));

  svgG.selectAll('*').remove();

  const w = window.innerWidth - 180;
  const h = window.innerHeight - 16;

  const linkSel = svgG.append('g')
    .selectAll('line')
    .data(links)
    .join('line')
    .attr('class', 'link')
    .attr('stroke', '#333')
    .attr('stroke-width', 0.7)
    .attr('stroke-opacity', 0.4);

  const nodeSel = svgG.append('g')
    .selectAll('circle')
    .data(nodes)
    .join('circle')
    .attr('r', d => nodeRadius(d))
    .attr('fill', d => nodeColor(d))
    .attr('opacity', 0.85);

  const labelSel = svgG.append('g')
    .selectAll('text')
    .data(nodes.filter(d => d.count >= 2 || nodes.length < 30))
    .join('text')
    .attr('class', 'node-label')
    .attr('fill', '#666')
    .attr('dy', d => nodeRadius(d) + 8)
    .text(d => d.label);

  sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(50))
    .force('charge', d3.forceManyBody().strength(-80))
    .force('center', d3.forceCenter(w / 2, h / 2))
    .force('collision', d3.forceCollide().radius(d => nodeRadius(d) + 3))
    .alphaDecay(0.04)
    .velocityDecay(0.4);

  sim.on('tick', () => {
    linkSel
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    nodeSel.attr('cx', d => d.x).attr('cy', d => d.y);
    labelSel.attr('x', d => d.x).attr('y', d => d.y);
  });

  setTimeout(() => { if (sim) sim.stop(); }, 3000);
}

// ── SSE Connection ────────────────────────────────────────────────────────────

function connectSSE() {
  const es = new EventSource(SSE_URL);

  es.addEventListener('memory', (e) => {
    try {
      const ev = JSON.parse(e.data);
      // Attach tags for co-occurrence in sidebar rendering.
      const tags = (ev.entities && ev.entities.tags) || [];
      ev._tags = tags;
      handleMemoryEvent(ev);
      // Store tags on the sidebar entry.
      if (sseEvents.length > 0) {
        sseEvents[sseEvents.length - 1].tags = tags;
      }
    } catch (err) {
      console.warn('sse parse error:', err);
    }
  });

  es.onopen = () => {
    sseConnected = true;
    updateStatus();
  };

  es.onerror = () => {
    sseConnected = false;
    updateStatus();
    // EventSource reconnects automatically per spec.
  };
}

// ── TG Gateway Fallback Poll ──────────────────────────────────────────────────

async function fetchTGGraph() {
  try {
    const res = await fetch(GATEWAY, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ limit: 200 }),
      signal: AbortSignal.timeout(5000),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    const triples = Array.isArray(data) ? data : (data.response || data.triples || data.results || []);
    const graph   = triplesToGraph(triples);

    tgConnected = true;
    graphData   = graph;

    // Only render TG graph when SSE has no activity nodes yet.
    if (activityNodes.size === 0 && graph.nodes.length > 0) {
      renderD3Graph(graph);
    }
    updateStatus();
  } catch (e) {
    tgConnected = false;
    updateStatus();
  }
}

// ── Bootstrap ─────────────────────────────────────────────────────────────────

connectSSE();
fetchTGGraph();
setInterval(fetchTGGraph, POLL_MS);
</script>
</body>
</html>
