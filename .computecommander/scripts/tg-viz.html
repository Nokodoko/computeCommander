<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TrustGraph Visualizer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; color: #c0c0c0; font-family: 'JetBrains Mono', 'Fira Code', monospace; overflow: hidden; }
  #header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: 12px 20px; background: rgba(10,10,15,0.9); border-bottom: 1px solid #1a1a2e; display: flex; align-items: center; gap: 16px; }
  #header h1 { font-size: 14px; color: #00ff88; font-weight: 600; }
  #header .stats { font-size: 11px; color: #666; }
  #header .live-indicator { font-size: 10px; padding: 2px 8px; border-radius: 3px; font-weight: 600; }
  #header .live-indicator.connected { background: #00ff8820; color: #00ff88; border: 1px solid #00ff8840; }
  #header .live-indicator.disconnected { background: #ff555520; color: #ff5555; border: 1px solid #ff555540; }
  #header .live-indicator.loading { background: #ffaa0020; color: #ffaa00; border: 1px solid #ffaa0040; }
  #controls { position: fixed; top: 50px; left: 20px; z-index: 10; display: flex; flex-direction: column; gap: 6px; }
  #controls button { background: #1a1a2e; border: 1px solid #2a2a4e; color: #888; padding: 6px 12px; font-size: 11px; font-family: inherit; cursor: pointer; border-radius: 3px; }
  #controls button:hover { border-color: #00ff88; color: #00ff88; }
  #controls button.active { background: #00ff8820; border-color: #00ff88; color: #00ff88; }
  #tooltip { position: fixed; display: none; background: #1a1a2e; border: 1px solid #2a2a4e; padding: 8px 12px; font-size: 11px; border-radius: 4px; pointer-events: none; z-index: 20; max-width: 400px; }
  #tooltip .iri { color: #00aaff; word-break: break-all; }
  #tooltip .type { color: #ff6688; }
  svg { width: 100vw; height: 100vh; }
  .link { stroke-opacity: 0.4; }
  .link-label { font-size: 16px; fill: #888; pointer-events: none; }
  .node-label { font-size: 18px; font-weight: 600; pointer-events: none; text-anchor: middle; dominant-baseline: central; }
</style>
</head>
<body>
<div id="header">
  <h1>TrustGraph</h1>
  <span class="live-indicator loading" id="live-status">LOADING</span>
  <span class="stats" id="stats">connecting...</span>
</div>
<div id="controls">
  <button id="btn-labels" class="active" onclick="toggleLabels()">Labels</button>
  <button id="btn-edge-labels" onclick="toggleEdgeLabels()">Edge Labels</button>
  <button id="btn-literals" class="active" onclick="toggleLiterals()">Literals</button>
  <button onclick="resetZoom()">Reset Zoom</button>
  <button onclick="refreshData()">Refresh</button>
</div>
<div id="tooltip"></div>
<svg></svg>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
// ── Configuration ─────────────────────────────────────────────────────────
// n0kos serves the page and proxies TG API calls to avoid CORS issues.
// ob-mcp SSE provides realtime event notifications.
const TG_PROXY_URL = '/api/tg/triples';
const OB_MCP_SSE_URL = 'http://localhost:8200/events/memories';
const TRIPLES_LIMIT = 500;
const REFRESH_DEBOUNCE_MS = 2000;

// ── State ─────────────────────────────────────────────────────────────────
let graphData = { nodes: [], links: [] };
let showLabels = true;
let showEdgeLabels = false;
let showLiterals = true;
let sseConnected = false;
let refreshTimer = null;

const width = window.innerWidth;
const height = window.innerHeight;

const svg = d3.select('svg');
const g = svg.append('g');

const zoom = d3.zoom()
  .scaleExtent([0.1, 8])
  .on('zoom', (e) => g.attr('transform', e.transform));
svg.call(zoom);

// ── D3 Force Simulation ──────────────────────────────────────────────────
const simulation = d3.forceSimulation([])
  .force('link', d3.forceLink([]).id(d => d.id).distance(200))
  .force('charge', d3.forceManyBody().strength(-800))
  .force('center', d3.forceCenter(width / 2, height / 2))
  .force('collision', d3.forceCollide().radius(d => nodeRadius(d) + 30))
  .on('tick', ticked);

// SVG groups for layered rendering.
const linkGroup = g.append('g').attr('class', 'links');
const edgeLabelGroupEl = g.append('g').attr('class', 'edge-labels');
const nodeGroup = g.append('g').attr('class', 'nodes');
const labelGroup = g.append('g').attr('class', 'labels');

const tooltip = d3.select('#tooltip');

// ── Data Fetching ─────────────────────────────────────────────────────────

/** Fetch all triples from TrustGraph via the n0kos proxy. */
async function fetchTriples() {
  try {
    const resp = await fetch(TG_PROXY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ limit: TRIPLES_LIMIT }),
    });

    if (!resp.ok) {
      console.error('[tg-viz] TG proxy error:', resp.status);
      return null;
    }

    const data = await resp.json();
    const triples = data.response || [];
    return triplesToGraph(triples);
  } catch (err) {
    console.error('[tg-viz] Failed to fetch triples:', err);
    return null;
  }
}

/** Convert TG triples to D3 graph format { nodes, links }. */
function triplesToGraph(triples) {
  const nodeMap = new Map();
  const links = [];

  function ensureNode(term) {
    const id = termId(term);
    if (!nodeMap.has(id)) {
      nodeMap.set(id, {
        id: id,
        label: termLabel(term),
        type: term.t === 'l' ? 'literal' : 'entity',
        fullIRI: term.i || term.v || term.d || '',
      });
    }
    return id;
  }

  for (const triple of triples) {
    const sourceId = ensureNode(triple.s);
    const targetId = ensureNode(triple.o);
    const predLabel = termLabel(triple.p);

    links.push({
      source: sourceId,
      target: targetId,
      label: predLabel,
    });
  }

  return {
    nodes: Array.from(nodeMap.values()),
    links: links,
  };
}

/** Extract a stable ID from a TG Term. */
function termId(term) {
  switch (term.t) {
    case 'i': return term.i;
    case 'l': return 'lit:' + (term.v || '').slice(0, 80);
    case 'b': return 'blank:' + term.d;
    default: return 'unknown:' + JSON.stringify(term);
  }
}

/** Extract a human-readable label from a TG Term. */
function termLabel(term) {
  switch (term.t) {
    case 'i': {
      const iri = term.i || '';
      const hashIdx = iri.lastIndexOf('#');
      const slashIdx = iri.lastIndexOf('/');
      const idx = Math.max(hashIdx, slashIdx);
      return idx >= 0 ? iri.slice(idx + 1) : iri;
    }
    case 'l': return (term.v || '').slice(0, 40);
    case 'b': return term.d || 'blank';
    default: return '?';
  }
}

// ── Graph Rendering ───────────────────────────────────────────────────────

function nodeColor(d) {
  if (d.type === 'literal') return '#4488cc';
  if (d.fullIRI && d.fullIRI.startsWith('https://schema.org/')) return '#ff6688';
  return '#00ff88';
}

function nodeRadius(d) {
  if (d.type === 'literal') return 10;
  if (d.fullIRI && d.fullIRI.startsWith('https://schema.org/')) return 14;
  return 18;
}

function edgeColor(label) {
  const map = {
    'type': '#333',
    'label': '#333',
    'description': '#333',
    'uses': '#00ff8866',
    'provides': '#ffaa0066',
    'stores_in': '#ff668866',
    'connects': '#4488cc66',
    'integrates_with': '#aa66ff66',
    'monitors': '#ff884466',
  };
  return map[label] || '#2a2a4e';
}

/** Update the D3 visualization with new graph data using enter/update/exit. */
function updateGraph(newData, animate) {
  const prevNodeIds = new Set(graphData.nodes.map(n => n.id));
  graphData = newData;

  // ── Links ──
  const linkSel = linkGroup.selectAll('line')
    .data(graphData.links, d => (d.source.id || d.source) + '-' + (d.target.id || d.target) + '-' + d.label);

  linkSel.exit().transition().duration(300).attr('stroke-opacity', 0).remove();

  const linkEnter = linkSel.enter().append('line')
    .attr('class', 'link')
    .attr('stroke', d => edgeColor(d.label))
    .attr('stroke-width', d => ['type','label','description'].includes(d.label) ? 0.5 : 1.5)
    .attr('stroke-opacity', 0);

  linkEnter.transition().duration(500).attr('stroke-opacity', 0.4);

  const linkMerge = linkEnter.merge(linkSel);

  // ── Edge Labels ──
  const edgeSel = edgeLabelGroupEl.selectAll('text')
    .data(graphData.links, d => (d.source.id || d.source) + '-' + (d.target.id || d.target) + '-' + d.label);

  edgeSel.exit().remove();

  const edgeEnter = edgeSel.enter().append('text')
    .attr('class', 'link-label')
    .text(d => d.label)
    .style('display', showEdgeLabels ? null : 'none');

  const edgeMerge = edgeEnter.merge(edgeSel);

  // ── Nodes ──
  const nodeSel = nodeGroup.selectAll('circle')
    .data(graphData.nodes, d => d.id);

  nodeSel.exit().transition().duration(300).attr('r', 0).remove();

  const nodeEnter = nodeSel.enter().append('circle')
    .attr('r', 0)
    .attr('fill', d => nodeColor(d))
    .attr('stroke', d => d3.color(nodeColor(d)).darker(0.5))
    .attr('stroke-width', d => (!prevNodeIds.has(d.id) && animate) ? 4 : 1)
    .attr('opacity', d => d.type === 'literal' ? 0.6 : 0.9)
    .call(d3.drag()
      .on('start', dragstarted)
      .on('drag', dragged)
      .on('end', dragended));

  nodeEnter.on('mouseover', (e, d) => {
    tooltip.style('display', 'block')
      .html('<div class="type">' + d.type + '</div><div class="iri">' + (d.fullIRI || d.id) + '</div><div>' + d.label + '</div>');
  }).on('mousemove', (e) => {
    tooltip.style('left', (e.clientX + 15) + 'px').style('top', (e.clientY - 10) + 'px');
  }).on('mouseout', () => tooltip.style('display', 'none'));

  nodeEnter.transition().duration(500).attr('r', d => nodeRadius(d));

  if (animate) {
    nodeEnter.transition().delay(500).duration(1000).attr('stroke-width', 1);
  }

  const nodeMerge = nodeEnter.merge(nodeSel);

  // ── Node Labels ──
  const labelSel = labelGroup.selectAll('text')
    .data(graphData.nodes, d => d.id);

  labelSel.exit().transition().duration(300).attr('fill-opacity', 0).remove();

  const labelEnter = labelSel.enter().append('text')
    .attr('class', 'node-label')
    .attr('dy', d => nodeRadius(d) + 24)
    .attr('fill', d => d.type === 'literal' ? '#4488cc88' : '#aaa')
    .attr('fill-opacity', 0)
    .text(d => d.label.length > 25 ? d.label.slice(0, 22) + '...' : d.label)
    .style('display', showLabels ? null : 'none');

  labelEnter.transition().duration(500).attr('fill-opacity', 1);

  const labelMerge = labelEnter.merge(labelSel);

  // ── Update simulation ──
  simulation.nodes(graphData.nodes);
  simulation.force('link').links(graphData.links);
  simulation.alpha(animate ? 0.5 : 1).restart();

  // Store merged selections for tick updates.
  window._linkSel = linkMerge;
  window._edgeSel = edgeMerge;
  window._nodeSel = nodeMerge;
  window._labelSel = labelMerge;

  d3.select('#stats').text(graphData.nodes.length + ' nodes, ' + graphData.links.length + ' edges');
}

function ticked() {
  if (window._linkSel) {
    window._linkSel
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  }
  if (window._edgeSel) {
    window._edgeSel
      .attr('x', d => (d.source.x + d.target.x) / 2)
      .attr('y', d => (d.source.y + d.target.y) / 2);
  }
  if (window._nodeSel) {
    window._nodeSel.attr('cx', d => d.x).attr('cy', d => d.y);
  }
  if (window._labelSel) {
    window._labelSel.attr('x', d => d.x).attr('y', d => d.y);
  }
}

// ── SSE Subscription ──────────────────────────────────────────────────────

function connectSSE() {
  const statusEl = d3.select('#live-status');
  statusEl.attr('class', 'live-indicator loading').text('CONNECTING');

  const source = new EventSource(OB_MCP_SSE_URL);

  source.addEventListener('memory', function(e) {
    // Any memory event means new data was written to ob-mcp.
    // Debounce: wait for burst to finish before re-querying TG.
    scheduleRefresh();
  });

  source.addEventListener('open', function() {
    sseConnected = true;
    statusEl.attr('class', 'live-indicator connected').text('LIVE');
    console.log('[tg-viz] SSE connected');
  });

  source.addEventListener('error', function(e) {
    sseConnected = false;
    statusEl.attr('class', 'live-indicator disconnected').text('DISCONNECTED');
    console.warn('[tg-viz] SSE error, will auto-reconnect');
  });
}

/** Debounced refresh: wait for SSE event burst to settle before re-querying. */
function scheduleRefresh() {
  if (refreshTimer) clearTimeout(refreshTimer);
  refreshTimer = setTimeout(async function() {
    refreshTimer = null;
    await refreshData();
  }, REFRESH_DEBOUNCE_MS);
}

/** Manually trigger a data refresh from TrustGraph. */
async function refreshData() {
  const newData = await fetchTriples();
  if (newData) {
    updateGraph(newData, true);
  }
}

// ── Drag Handlers ─────────────────────────────────────────────────────────
function dragstarted(e) { if (!e.active) simulation.alphaTarget(0.3).restart(); e.subject.fx = e.subject.x; e.subject.fy = e.subject.y; }
function dragged(e) { e.subject.fx = e.x; e.subject.fy = e.y; }
function dragended(e) { if (!e.active) simulation.alphaTarget(0); e.subject.fx = null; e.subject.fy = null; }

// ── UI Toggle Functions ───────────────────────────────────────────────────
function toggleLabels() {
  showLabels = !showLabels;
  labelGroup.selectAll('text').style('display', showLabels ? null : 'none');
  d3.select('#btn-labels').classed('active', showLabels);
}

function toggleEdgeLabels() {
  showEdgeLabels = !showEdgeLabels;
  edgeLabelGroupEl.selectAll('text').style('display', showEdgeLabels ? null : 'none');
  d3.select('#btn-edge-labels').classed('active', showEdgeLabels);
}

function toggleLiterals() {
  showLiterals = !showLiterals;
  nodeGroup.selectAll('circle').style('display', d => (!showLiterals && d.type === 'literal') ? 'none' : null);
  labelGroup.selectAll('text').style('display', d => {
    if (!showLabels) return 'none';
    if (!showLiterals && d.type === 'literal') return 'none';
    return null;
  });
  linkGroup.selectAll('line').style('display', d => {
    if (!showLiterals) {
      const s = typeof d.source === 'object' ? d.source : graphData.nodes.find(n => n.id === d.source);
      const t = typeof d.target === 'object' ? d.target : graphData.nodes.find(n => n.id === d.target);
      if ((s && s.type === 'literal') || (t && t.type === 'literal')) return 'none';
    }
    return null;
  });
  d3.select('#btn-literals').classed('active', showLiterals);
}

function resetZoom() { svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity); }

// ── Auto-Zoom on Simulation Settle ────────────────────────────────────────
simulation.on('end', function() {
  if (graphData.nodes.length === 0) return;
  const bounds = g.node().getBBox();
  const fullWidth = width, fullHeight = height;
  const bw = bounds.width, bh = bounds.height;
  if (bw === 0 || bh === 0) return;
  const midX = bounds.x + bw / 2, midY = bounds.y + bh / 2;
  const scale = 0.85 / Math.max(bw / fullWidth, bh / fullHeight);
  const tx = fullWidth / 2 - scale * midX, ty = fullHeight / 2 - scale * midY;
  svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
});

// ── Initialize ────────────────────────────────────────────────────────────
(async function init() {
  const data = await fetchTriples();
  if (data) {
    updateGraph(data, false);
  } else {
    d3.select('#stats').text('Failed to load graph data');
    d3.select('#live-status').attr('class', 'live-indicator disconnected').text('TG OFFLINE');
  }

  connectSSE();
})();
</script>
</body>
</html>
