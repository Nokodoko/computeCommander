  <g transform="translate(796,244) rotate(28)">
    <rect x="-10" y="-7" width="20" height="14" rx="2" fill="#1a0d0d" stroke="#ff6b35" stroke-width="1.2"/>
    <polyline points="-10,-7 0,1 10,-7" fill="none" stroke="#ff6b35" stroke-width="1.2"/>
  </g>

  <!-- unix-coder → code-review (reply) -->
  <line x1="298" y1="430" x2="540" y2="430" stroke="#00ff88" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrowBlue2)" opacity="0.5"/>
  <g transform="translate(418,430)">
    <rect x="-10" y="-7" width="20" height="14" rx="2" fill="#0d1a0d" stroke="#00ff88" stroke-width="1.2"/>
