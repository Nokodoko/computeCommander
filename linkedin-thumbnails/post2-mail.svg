  <rect x="506" y="148" width="188" height="88" rx="12" fill="#0a1520" stroke="#00d4ff" stroke-width="2.5" filter="url(#glowStrong2)"/>
  <!-- envelope icon inside -->
  <rect x="518" y="162" width="32" height="22" rx="3" fill="none" stroke="#00d4ff" stroke-width="1.5"/>
  <polyline points="518,162 534,174 550,162" fill="none" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="580" y="172" font-family="Courier New, monospace" font-size="8" fill="#507090" text-anchor="start">inbox: 0</text>
  <text x="562" y="200" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#00d4ff" text-anchor="middle">supervisor</text>
  <text x="562" y="218" font-family="Courier New, monospace" font-size="10" fill="#507090" text-anchor="middle">@supervisor</text>
  <text x="562" y="230" font-family="Courier New, monospace" font-size="9" fill="#304050" text-anchor="middle">orchestration</text>

  <!-- CODER (bottom left) -->
  <rect x="110" y="340" width="188" height="88" rx="12" fill="#0d1a0d" stroke="#00ff88" stroke-width="2" filter="url(#glow2)"/>
  <rect x="122" y="354" width="32" height="22" rx="3" fill="none" stroke="#00ff88" stroke-width="1.5"/>
  <polyline points="122,354 138,366 154,354" fill="none" stroke="#00ff88" stroke-width="1.5"/>
  <text x="184" y="364" font-family="Courier New, monospace" font-size="8" fill="#408060" text-anchor="start">inbox: 3</text>
  <text x="204" y="392" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#00ff88" text-anchor="middle">unix-coder</text>
  <text x="204" y="410" font-family="Courier New, monospace" font-size="10" fill="#408060" text-anchor="middle">@builders</text>
  <text x="204" y="422" font-family="Courier New, monospace" font-size="9" fill="#253520" text-anchor="middle">implementation</text>

  <!-- REVIEWER (bottom right) -->
  <rect x="540" y="380" width="188" height="88" rx="12" fill="#1a1a0d" stroke="#ffd700" stroke-width="2" filter="url(#glow2)"/>
  <rect x="552" y="394" width="32" height="22" rx="3" fill="none" stroke="#ffd700" stroke-width="1.5"/>
