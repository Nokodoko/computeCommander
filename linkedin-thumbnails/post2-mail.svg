  <text x="395" y="545" font-family="Courier New, monospace" font-size="13" font-weight="bold" fill="#ffd700" text-anchor="middle">@reviewers</text>

  <!-- @leads -->
  <rect x="500" y="526" width="120" height="28" rx="14" fill="#1a0d2e" stroke="#cc44ff" stroke-width="1.5"/>
  <text x="560" y="545" font-family="Courier New, monospace" font-size="13" font-weight="bold" fill="#cc44ff" text-anchor="middle">@leads</text>

  <!-- @security -->
  <rect x="650" y="526" width="150" height="28" rx="14" fill="#1a0d0d" stroke="#ff6b35" stroke-width="1.5"/>
  <text x="725" y="545" font-family="Courier New, monospace" font-size="13" font-weight="bold" fill="#ff6b35" text-anchor="middle">@security</text>

  <!-- @all -->
  <rect x="830" y="526" width="120" height="28" rx="14" fill="#0a1520" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="890" y="545" font-family="Courier New, monospace" font-size="13" font-weight="bold" fill="#00d4ff" text-anchor="middle">@all</text>

  <!-- DB label -->
  <text x="600" y="578" font-family="Courier New, monospace" font-size="11" fill="#304050" text-anchor="middle">messages.db  |  threads  |  receipts  |  broadcast routing  |  SQLite</text>

  <!-- Top right: DB icon -->
  <g transform="translate(1090, 148)">
    <ellipse cx="0" cy="0" rx="50" ry="14" fill="#0a1520" stroke="#0A66C2" stroke-width="1.5"/>
    <rect x="-50" y="0" width="100" height="36" fill="#0a1520" stroke="#0A66C2" stroke-width="1.5"/>
    <ellipse cx="0" cy="36" rx="50" ry="14" fill="#0a1520" stroke="#0A66C2" stroke-width="1.5"/>
    <ellipse cx="0" cy="18" rx="50" ry="14" fill="#0d1a2e" stroke="#0A66C2" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="0" y="22" font-family="Courier New, monospace" font-size="11" font-weight="bold" fill="#00d4ff" text-anchor="middle" filter="url(#glow2)">SQLite</text>
    <text x="0" y="56" font-family="Courier New, monospace" font-size="9" fill="#507090" text-anchor="middle">messages.db</text>
  </g>
