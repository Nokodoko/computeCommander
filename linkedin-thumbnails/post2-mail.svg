  <text x="204" y="252" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#cc44ff" text-anchor="middle">tech-lead</text>
  <text x="204" y="270" font-family="Courier New, monospace" font-size="10" fill="#804090" text-anchor="middle">@leads</text>
  <text x="204" y="282" font-family="Courier New, monospace" font-size="9" fill="#401a50" text-anchor="middle">architecture</text>

  <!-- MERGER (middle right) -->
  <rect x="890" y="260" width="188" height="88" rx="12" fill="#1a0d0d" stroke="#ff6b35" stroke-width="2" filter="url(#glow2)"/>
  <rect x="902" y="274" width="32" height="22" rx="3" fill="none" stroke="#ff6b35" stroke-width="1.5"/>
  <polyline points="902,274 918,286 934,274" fill="none" stroke="#ff6b35" stroke-width="1.5"/>
  <text x="964" y="284" font-family="Courier New, monospace" font-size="8" fill="#804020" text-anchor="start">inbox: 1</text>
  <text x="984" y="312" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#ff6b35" text-anchor="middle">merge-mgr</text>
  <text x="984" y="330" font-family="Courier New, monospace" font-size="10" fill="#804020" text-anchor="middle">@merger</text>
  <text x="984" y="342" font-family="Courier New, monospace" font-size="9" fill="#501a0a" text-anchor="middle">git operations</text>

  <!-- ========== CONNECTION LINES ========== -->

  <!-- supervisor → unix-coder -->
  <line x1="506" y1="210" x2="298" y2="350" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="8,4" marker-end="url(#arrowGreen)" opacity="0.7"/>
  <!-- small envelope on line -->
  <g transform="translate(390,272) rotate(-32)">
    <rect x="-10" y="-7" width="20" height="14" rx="2" fill="#0a1a2a" stroke="#00d4ff" stroke-width="1.2"/>
    <polyline points="-10,-7 0,1 10,-7" fill="none" stroke="#00d4ff" stroke-width="1.2"/>
  </g>

  <!-- supervisor → tech-lead -->
  <line x1="506" y1="192" x2="298" y2="244" stroke="#cc44ff" stroke-width="1.5" stroke-dasharray="8,4" marker-end="url(#arrowBlue2)" opacity="0.7"/>
  <g transform="translate(400,216) rotate(-18)">
    <rect x="-10" y="-7" width="20" height="14" rx="2" fill="#1a0d2e" stroke="#cc44ff" stroke-width="1.2"/>
    <polyline points="-10,-7 0,1 10,-7" fill="none" stroke="#cc44ff" stroke-width="1.2"/>
  </g>

  <!-- supervisor → code-review -->
  <line x1="634" y1="236" x2="634" y2="380" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="8,4" marker-end="url(#arrowBlue2)" opacity="0.7"/>
  <g transform="translate(634,310)">
