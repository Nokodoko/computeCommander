  <text x="614" y="404" font-family="Courier New, monospace" font-size="8" fill="#807040" text-anchor="start">inbox: 2</text>
  <text x="634" y="432" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#ffd700" text-anchor="middle">code-review</text>
